name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'phieu-apk/**'
      - 'phieu-scan/index.html'
      - 'phieu-scan/parse.js'
      - '.github/workflows/build-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phieu-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: phieu-apk/package-lock.json
      - run: npm ci
      - run: npm run sync
      - name: Build debug APK
        working-directory: phieu-apk/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: phieu-hang-apk
          path: phieu-apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
