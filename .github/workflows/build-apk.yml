name: Build APK

on:
  push:
    branches: [ccr-96663076-ozjg5r]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android-app assembleDebug --no-daemon
      - name: Đặt tên file
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk so-thu-chi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: so-thu-chi-apk
          path: so-thu-chi.apk
      - name: Đăng lên Releases để tải về điện thoại
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" so-thu-chi.apk \
            --title "Sổ thu chi APK #${{ github.run_number }}" \
            --notes "Cài đặt: tải so-thu-chi.apk về điện thoại Android, mở file, cho phép cài từ nguồn này." \
            --target "${{ github.sha }}"
