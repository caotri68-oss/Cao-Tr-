<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Đảo Hình Que – Demo cây rung & nước</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1a24; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui {
    position: fixed; left: 12px; bottom: 12px; right: 12px; max-width: 360px;
    padding: 12px 14px; border-radius: 14px; color: #fff;
    background: rgba(10, 20, 30, 0.55); backdrop-filter: blur(8px);
    font-size: 14px; line-height: 1.4;
  }
  #ui h1 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  #ui label { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  #ui label span { width: 78px; flex: none; }
  #ui input[type=range] { flex: 1; }
  #ui small { display: block; margin-top: 8px; opacity: 0.7; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Đảo hình que – demo</h1>
  <label><span>Gió</span><input id="wind" type="range" min="0" max="2" step="0.05" value="1" /></label>
  <label><span>Hoàng hôn</span><input id="tod" type="range" min="0" max="1" step="0.01" value="0" /></label>
  <small>Kéo để xoay · chụm/cuộn để zoom</small>
</div>
<!--SCRIPT-->
</body>
</html>
