<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ TPCN">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sổ TPCN gia đình</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#5b6573;--line:#e3e7ec;--pri:#0f766e;--pri2:#ccfbf1;--warn:#9a3412;--warnbg:#fff7ed;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--ink:#e6ebf1;--mute:#9aa7b8;--line:#2a3441;--pri:#2dd4bf;--pri2:#123a38;--warn:#fbbf24;--warnbg:#2b2210;--bad:#f87171}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
header{background:var(--card);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
header .gear{border:0;background:none;color:var(--mute);width:44px;height:44px;margin:-6px -8px 0 0;display:grid;place-items:center;cursor:pointer;border-radius:10px}
header .gear.on{color:var(--pri)}
header .gear svg,nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
header .sub{font-size:14px;color:var(--mute)}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px;max-width:720px;width:100%;margin:0 auto}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;color:var(--mute);padding:8px 0 6px;font:inherit;font-size:12px;font-weight:500;min-height:58px;cursor:pointer;display:grid;justify-items:center;gap:2px}
nav button.on{color:var(--pri);font-weight:700}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
textarea{min-height:90px;resize:vertical}
label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:12px;cursor:pointer;min-height:44px;font-weight:500}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#06201d}}
.btn.sm{padding:6px 12px;font-size:14px;min-height:38px;border-radius:10px}
.btn.del{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 3px;font-size:17px}
.mute{color:var(--mute);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;min-height:42px;white-space:nowrap;cursor:pointer}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.chips button.on{color:#06201d}}
.slot{font-size:15px;font-weight:700;color:var(--pri);margin:18px 0 8px}
.dose{display:flex;align-items:center;gap:12px}
.dose input[type=checkbox]{width:30px;height:30px;min-height:0;accent-color:var(--pri);flex:none}
.dose.done .t{text-decoration:line-through;color:var(--mute)}
.grow{flex:1;min-width:0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:999px;padding:2px 10px;font-size:13px;margin:2px 4px 2px 0}
.empty{text-align:center;color:var(--mute);padding:36px 8px}
.ing{display:grid;grid-template-columns:1fr 70px 70px 28px;gap:6px;margin-bottom:6px}
table.ing2{width:100%;border-collapse:collapse;font-size:14px}
table.ing2 td,table.ing2 th{text-align:left;padding:4px 6px 4px 0;border-bottom:1px solid var(--line)}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,94vw);background:var(--card);color:var(--ink);max-height:92vh}
dialog::backdrop{background:#0008}
dialog form{padding:16px;display:grid;gap:10px}
.imgs{display:flex;gap:6px;flex-wrap:wrap}.imgs img{height:70px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.ing input.chk{border:2px solid var(--warn);background:var(--warnbg)}
#report{display:none}
@media print{header,main,nav,dialog{display:none!important}#report{display:block;font:12pt/1.4 system-ui,sans-serif;color:#000}body{display:block;background:#fff}#report table{width:100%;border-collapse:collapse}#report th,#report td{border:1px solid #444;padding:4px;text-align:left;vertical-align:top;font-size:10.5pt}}
.w{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;margin-bottom:10px}
.w3{background:#fef2f2;border-color:#f5b5b5;color:#7f1d1d}.w2{background:var(--warnbg);border-color:var(--warn)}.w1{background:var(--bg)}
@media (prefers-color-scheme:dark){.w3{background:#3b1414;border-color:#7f1d1d;color:#fecaca}}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:8px}
.note{background:var(--warnbg);border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px}
</style>
</head>
<body>
<header><div><h1 id="ttl">Hôm nay</h1><div class="sub" id="sub"></div></div><button class="gear" id="gear" aria-label="Cài đặt" onclick="go('set')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="report"></div>
<dialog id="dlg"></dialog>
<script src="kb.js"></script>

<script>
'use strict';
/* ---------- Lưu trữ: IndexedDB ---------- */
const DB='tpcn-v2',KEY='state';
const empty=()=>({v:2,members:[],products:[],plans:[],intakes:[],notes:[],diary:[],docs:[],dismissed:[],settings:{ul:'efsa'}});
let S=empty();
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,2);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('img'))d.createObjectStore('img')};
  r.onsuccess=()=>{r.result.onversionchange=()=>r.result.close();res(r.result)};r.onerror=()=>rej(r.error)});
async function load(){try{const db=await idb();const d=await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(KEY);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)});S={...empty(),...(d||{})}}catch(e){alert('Không mở được bộ nhớ trình duyệt: '+e.message)}
  }
// Danh sách sản phẩm chung (không có thông tin cá nhân) lấy từ GitHub khi tủ còn trống
async function loadSharedProducts(){
  try{const r=await fetch('data/san-pham.json',{cache:'no-cache'});if(!r.ok)return;
    const d=await r.json();if(!d||!Array.isArray(d.products))return;
    mergeProducts(d.products.filter(p=>p&&typeof p.id==='string'&&/^prd-[a-z0-9-]{1,60}$/.test(p.id)&&typeof p.name==='string'&&Array.isArray(p.ingredients)));
    save();render()}catch(e){}}
let saveT;async function flush(){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(S,KEY);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){alert('Lưu thất bại: '+e.message)}}
function save(){clearTimeout(saveT);saveT=setTimeout(flush,50)}
addEventListener('pagehide',()=>{clearTimeout(saveT);flush()});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
/* Ảnh lưu riêng khỏi dữ liệu chính để mỗi lần lưu không phải ghi lại cả ảnh */
async function imgTx(mode,fn){const db=await idb();try{return await new Promise((res,rej)=>{const t=db.transaction('img',mode);const r=fn(t.objectStore('img'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}finally{db.close()}}
const putImg=(id,u)=>imgTx('readwrite',s=>s.put(u,id));
const getImg=id=>imgTx('readonly',s=>s.get(id));
const delImg=id=>imgTx('readwrite',s=>s.delete(id)).catch(()=>{});
async function loadImgs(ids,sel){const box=$(sel);if(!box)return;box.textContent='';for(const id of ids||[]){const u=await getImg(id).catch(()=>null);if(u&&/^data:image\//.test(u)){const im=document.createElement('img');im.src=u;im.alt='Ảnh nhãn';im.onclick=()=>window.open(u);box.appendChild(im)}}}

/* ---------- Tiện ích ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}; // giờ địa phương, không phải UTC
const byId=(a,id)=>a.find(x=>x.id===id);
const pname=id=>byId(S.products,id)?.name||'(đã xoá)';
const mname=id=>byId(S.members,id)?.name||'(đã xoá)';
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const WD=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const fmtDay=()=>{const d=new Date();return WD[d.getDay()]+', '+d.getDate()+'/'+(d.getMonth()+1)};

/* ---------- Điều hướng ---------- */
const IC={today:'<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18M9 15.5l2 2 4-4"/>',shelf:'<path d="M10.5 20.5l-7-7a4.9 4.9 0 017-7l7 7a4.9 4.9 0 01-7 7z"/><path d="M8 8l8 8"/>',know:'<path d="M2.5 5h6a3.5 3.5 0 013.5 3.5V20a2.5 2.5 0 00-2.5-2.5h-7z"/><path d="M21.5 5h-6A3.5 3.5 0 0012 8.5V20a2.5 2.5 0 012.5-2.5h7z"/>',fam:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17.5 14.5a5 5 0 014 5"/>'};
const TABS=[['today','Hôm nay'],['shelf','Tủ thuốc'],['know','Thư viện'],['fam','Gia đình']];
let tab='today',sub=null,fMember='',draft=null;
function go(t,s=null){tab=t;sub=s;render();$('#view').scrollTop=0}
function render(){
  const cur=tab==='add'?'shelf':tab;
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===cur?'on':''}" ${k===cur?'aria-current="page"':''} onclick="go('${k}')"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>${l}</button>`).join('');
  $('#gear').classList.toggle('on',tab==='set');
  ({today:vToday,shelf:vShelf,add:vAdd,know:vKnow,fam:vFam,set:vSet})[tab]();
}
function view(title,sub_,html){$('#ttl').textContent=title;$('#sub').textContent=sub_||'';$('#view').innerHTML=html}

/* ---------- Hộp thoại ---------- */
function dialog(title,fields,data,onSave){
  const d=$('#dlg');
  const f=fields.map(x=>{
    const v=data[x.k]??'',id='f_'+x.k;
    if(x.t==='area')return`<label>${x.l}<textarea id="${id}">${esc(v)}</textarea></label>`;
    if(x.t==='sel')return`<label>${x.l}<select id="${id}">${x.o.map(([val,lab])=>`<option value="${esc(val)}" ${val===v?'selected':''}>${esc(lab)}</option>`).join('')}</select></label>`;
    return`<label>${x.l}<input id="${id}" type="${x.t||'text'}" value="${esc(v)}"></label>`}).join('');
  d.innerHTML=`<form method="dialog"><b>${esc(title)}</b>${f}<div class="row"><button class="btn pri" value="ok">Lưu</button><button class="btn" value="x" formnovalidate>Huỷ</button></div></form>`;
  d.onclose=()=>{if(d.returnValue!=='ok')return;const o={...data};fields.forEach(x=>{const v=$('#f_'+x.k).value;o[x.k]=x.t==='number'?(v===''?'':Number(v)):v.trim()});onSave(o)};
  d.returnValue='';d.showModal();
}
const upsert=(arr,o)=>{const i=arr.findIndex(x=>x.id===o.id);i<0?arr.push(o):arr[i]=o;save();render()};
const remove=(arr,id,msg)=>{if(confirm(msg||'Xoá mục này?')){arr.splice(arr.findIndex(x=>x.id===id),1);save();render()}};

/* ---------- Cảnh báo ----------
   Mức tối đa (UL) cho người lớn từ NIH Office of Dietary Supplements. App chỉ nhắc, không thay bác sĩ. */
const ODS='https://ods.od.nih.gov/factsheets/',odsUrl=s=>ODS+s+'-HealthProfessional/';
const NUTR={
  vitA:{n:'Vitamin A',re:/vitamin a\b|retinol|retinyl/i,ul:3000,u:'mcg',src:'VitaminA',skipForm:/carot/i,note:'Chỉ tính dạng retinol, không tính beta-caroten.'},
  vitC:{n:'Vitamin C',re:/vitamin c\b|ascorb/i,ul:2000,u:'mg',src:'VitaminC'},
  vitD:{n:'Vitamin D',re:/vitamin d\d?\b|cholecalciferol|ergocalciferol/i,ul:100,u:'mcg',src:'VitaminD'},
  vitE:{n:'Vitamin E',re:/vitamin e\b|tocopher/i,ul:1000,u:'mg',src:'VitaminE'},
  b6:{n:'Vitamin B6',re:/vitamin b-?6\b|pyridox/i,ul:100,u:'mg',src:'VitaminB6',note:'Châu Âu (EFSA) đặt mức thấp hơn: 12 mg/ngày.'},
  niacin:{n:'Niacin (B3)',re:/niacin|vitamin b-?3\b|nicotin/i,ul:35,u:'mg',src:'Niacin'},
  folic:{n:'Axit folic',re:/folic|folate|folát|listov/i,ul:1000,u:'mcg',src:'Folate',note:'Mức này tính cho folic acid; nhãn ghi theo DFE sẽ cho số cao hơn lượng thật.'},
  ca:{n:'Canxi',re:/calci|canxi|vápník/i,ul:2500,ul51:2000,u:'mg',src:'Calcium'},
  fe:{n:'Sắt',re:/\biron\b|sắt|železo|ferrous|ferric/i,ul:45,u:'mg',src:'Iron'},
  zn:{n:'Kẽm',re:/zinc|kẽm|zinek/i,ul:40,u:'mg',src:'Zinc'},
  mg:{n:'Magie',re:/magnes|magie|hořčík/i,ul:350,u:'mg',src:'Magnesium',note:'Chỉ tính magie từ thực phẩm chức năng, không tính từ thức ăn.'},
  se:{n:'Selen',re:/selen/i,ul:400,u:'mcg',src:'Selenium'},
  io:{n:'I-ốt',re:/iodine|iod|i-?ốt|jód/i,ul:1100,u:'mcg',src:'Iodine'},
  cu:{n:'Đồng',re:/copper|cupr|měď/i,ul:10000,u:'mcg',src:'Copper'},
  mn:{n:'Mangan',re:/mangan/i,ul:11,u:'mg',src:'Manganese'},
  boron:{n:'Boron',re:/boron|borat|boric/i,ul:20,u:'mg',src:'Boron',srcUrl:'https://ods.od.nih.gov/factsheets/Boron-Consumer/'},
  vitK:{n:'Vitamin K',re:/vitamin k\d?\b|phylloquinone|menaquinone/i,u:'mcg',src:'VitaminK'},
  curc:{n:'Curcumin',re:/curcum|turmeric|nghệ/i,u:'mg',srcUrl:'https://www.nccih.nih.gov/health/turmeric'},
  om3:{n:'Omega-3',re:/omega-?3\b|\bepa\b|\bdha\b|fish oil|dầu cá|rybí olej/i,u:'mg',src:'Omega3FattyAcids'}
};
const nUrl=N=>N.srcUrl||odsUrl(N.src);
/* Mức tối đa của EFSA (châu Âu), mặc định cho người ở Séc. Đã đối chiếu với ghi chú trong kho Obsidian.
   safe: EFSA không đặt được UL, chỉ đặt "mức an toàn". */
const EFSA_SUM='https://www.efsa.europa.eu/sites/default/files/2024-05/ul-summary-report.pdf';
const EF={
  vitA:{ul:3000,note:'Chỉ tính vitamin A dạng retinol.'},
  vitD:{ul:100},
  vitE:{ul:300},
  b6:{ul:12,note:'EFSA hạ xuống 12 mg năm 2023.'},
  niacin:{ul:10,amideUl:900,note:'10 mg cho nicotinic acid; nicotinamide (niacinamide) có mức riêng 900 mg.'},
  folic:{ul:1000,note:'Tính cho folic acid; nhãn ghi theo DFE sẽ cho số cao hơn lượng thật.'},
  ca:{ul:2500,note:'Mức này tính cả canxi từ thức ăn; app chỉ cộng phần thực phẩm chức năng.'},
  fe:{ul:40,safe:true,url:'https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11167337/',note:'EFSA 2024 không đặt được UL cho sắt; 40 mg là mức an toàn.'},
  zn:{ul:25},
  mg:{ul:250,note:'Chỉ tính magie bổ sung; nên chia ít nhất 2 lần/ngày.'},
  se:{ul:255,url:'https://efsa.onlinelibrary.wiley.com/doi/10.2903/j.efsa.2023.7704',note:'EFSA hạ từ 300 xuống 255 µg năm 2023.'},
  io:{ul:600},
  boron:{ul:10,note:'EFSA áp dụng cho axit boric và borat, dựa trên dữ liệu động vật.'},
  cu:{ul:5000},
  mn:{ul:8,safe:true,url:'https://efsa.onlinelibrary.wiley.com/doi/full/10.2903/j.efsa.2023.8413',note:'EFSA 2023 không đặt được UL; 8 mg là mức an toàn, tính cả thức ăn.'}
};
const ulStd=()=>(S.settings||{}).ul==='nih'?'nih':'efsa';
function limitOf(k,age){const N=NUTR[k];
  if(ulStd()==='efsa'){const e=EF[k];if(!e)return null;return{ul:e.ul,u:N.u,note:e.note||'',url:e.url||EFSA_SUM,by:'EFSA',safe:!!e.safe,amideUl:e.amideUl}}
  if(!N.ul)return null;return{ul:(age!=null&&age>=51&&N.ul51)||N.ul,u:N.u,note:N.note||'',url:nUrl(N),by:'NIH'}}
const isAmide=g=>{const s=g.name+' '+(g.form||'');return /amide/i.test(s)&&!/nicotinic acid|inositol/i.test(s)};
// Cặp chất nên uống cách nhau (phút)
const SPACING=[
  {a:'ca',b:'fe',min:120,why:'Canxi làm giảm hấp thu sắt.',src:'Iron'},
  {a:'zn',b:'fe',min:120,why:'Sắt liều cao có thể làm giảm hấp thu kẽm.',src:'Zinc'}
];
// Tương tác với thuốc kê đơn: dò theo tên thuốc ghi trong hồ sơ
const DRUG=[
  {id:'warfarin',re:/warfarin|coumadin|lawarin/i,n:['vitK'],title:'Vitamin K và thuốc chống đông warfarin',text:'Vitamin K làm thay đổi tác dụng của warfarin; lượng vitamin K cần giữ ổn định.',src:'VitaminK'},
  {id:'levo',re:/levothyrox|euthyrox|letrox|thyrax|synthroid/i,n:['ca','fe'],title:'Canxi, sắt và thuốc tuyến giáp',text:'Canxi và sắt có thể làm giảm hấp thu levothyroxine; thường phải uống cách xa thuốc vài giờ.',src:'Calcium'},

const kbHasName=n=>Object.values(window.KB||{}).some(k=>norm(k.name)===norm(n));
function herbWarnings(m,plans,add){
  const meds=m.meds||'',all=meds+' '+(m.conditions||'');
  for(const h of HERB){
    const hit=plans.filter(p=>{const pr=byId(S.products,p.productId);return h.re.test(pr.name||'')||(pr.ingredients||[]).some(g=>h.re.test((g.name||'')+' '+(g.form||'')))});
    if(!hit.length)continue;
    const prods=[...new Set(hit.map(p=>pname(p.productId)))].join(', '),kn=(window.KB&&window.KB[h.kb])?window.KB[h.kb].name:null;
    h.rules.forEach(([re,lv,text,wide],i)=>{if(!re.test(wide?all:meds))return;
      add(lv,'herb-'+h.id+'-'+i,h.n+' và thuốc hoặc bệnh nền',`${text} Liên quan: ${prods}. Hỏi bác sĩ hoặc dược sĩ.`,h.url,null,kn)})}}
const LV=['','Nhẹ','Vừa','Nặng'];
const fmt=n=>String(Math.round(n*10)/10);
const ageOf=m=>m.born?new Date().getFullYear()-Number(m.born):null;
const mins=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?+m[1]*60+ +m[2]:null};
const hhmm=x=>pad(Math.floor(x/60))+':'+pad(x%60);
const nutrKey=g=>{for(const k in NUTR)if(NUTR[k].re.test(g.name||''))return k;return null};
const counts=(g,k)=>{const sk=NUTR[k].skipForm;if(!sk)return true;
  const fs=(g.form||'').replace(/\([^)]*\)/g,'').split(',').map(s=>s.trim()).filter(Boolean);
  return !(fs.length?fs.every(f=>sk.test(f)):sk.test(g.name))}; // chỉ loại khi mọi dạng đều là beta-caroten
function toUnit(a,u,t,k){if(a===''||a==null||Number.isNaN(Number(a)))return null;a=Number(a);if(u===t)return a;
  const f={g:1e6,mg:1e3,mcg:1};if(f[u]&&f[t])return a*f[u]/f[t];
  if(k==='vitD'&&u==='IU'&&t==='mcg')return a/40;return null}
const activePlans=(mid,day)=>S.plans.filter(p=>p.memberId===mid&&(!p.start||p.start<=day)&&(!p.end||p.end>=day)&&byId(S.products,p.productId));
const hasN=(p,k)=>(byId(S.products,p.productId)?.ingredients||[]).some(g=>nutrKey(g)===k&&counts(g,k));
function totals(mid,day){const t={};
  for(const p of activePlans(mid,day)){const pr=byId(S.products,p.productId),x=Number(p.servings)||1;
    for(const g of pr.ingredients||[]){const k=nutrKey(g);if(!k||!counts(g,k))continue;
      const e=t[k]=t[k]||{key:k,total:0,unknown:false,products:new Set()};
      const v=toUnit(g.amount,g.unit,NUTR[k].u,k);if(v==null)e.unknown=true;else{e.total+=v*x;if(k==='niacin'&&isAmide(g))e.amide=(e.amide||0)+v*x}e.products.add(pr.id)}}
  return t}
function warningsFor(m,day=today()){
  const W=[],age=ageOf(m),t=totals(m.id,day),plans=activePlans(m.id,day);
  const add=(lv,key,title,text,src,fix,vault)=>{if(lv<3&&(S.dismissed||[]).includes(m.id+'|'+key))return;W.push({lv,key,title,text,src,fix,vault,mid:m.id})};
  const adult=age==null||age>=19;
  for(const e of Object.values(t)){const N=NUTR[e.key];
    const L=adult?limitOf(e.key,age):null;
    const chk=(kk,label,tot,ul)=>{if(!tot)return;const w=L.safe?'mức an toàn':'mức tối đa',vn=S.notes.some(x=>norm(x.substance)===norm(N.n))?N.n:null;
      if(tot>ul)add(3,'ul-'+kk,`Vượt ${w}: ${label}`,`Tổng một ngày ${fmt(tot)} ${L.u}, ${w} cho người lớn theo ${L.by} là ${fmt(ul)} ${L.u}.${L.note?' '+L.note:''}`,L.url,null,vn);
      else if(tot>=ul*.8)add(2,'ul80-'+kk,`Gần ${w}: ${label}`,`Tổng một ngày ${fmt(tot)} ${L.u}, bằng ${Math.round(tot/ul*100)}% ${w} theo ${L.by} (${fmt(ul)} ${L.u}).${L.note?' '+L.note:''}`,L.url,null,vn)};
    if(L){if(L.amideUl!=null){chk(e.key,N.n+' dạng nicotinic acid',e.total-(e.amide||0),L.ul);chk(e.key+'-amide','Nicotinamide',e.amide||0,L.amideUl)}else chk(e.key,N.n,e.total,L.ul)}
    if(e.products.size>1)add(1,'dup-'+e.key,'Trùng hoạt chất: '+N.n,`Có trong ${e.products.size} sản phẩm: ${[...e.products].map(pname).join(', ')}.`);
    if(e.unknown)add(1,'unk-'+e.key,'Chưa tính đủ: '+N.n,'Có sản phẩm ghi chất này nhưng thiếu lượng hoặc đơn vị không đổi được, nên tổng có thể thiếu.')}
  for(const r of SPACING)for(const a of plans.filter(p=>hasN(p,r.a)))for(const b of plans.filter(p=>hasN(p,r.b))){
    if(a.productId===b.productId)continue;
    const ta=mins(a.time),tb=mins(b.time);if(ta==null||tb==null||Math.abs(ta-tb)>=r.min)continue;
    let nt=ta+r.min;if(nt>1439)nt=ta-r.min;
    add(2,`sp-${a.id}-${b.id}`,`Nên uống cách nhau: ${NUTR[r.a].n} và ${NUTR[r.b].n}`,`${pname(a.productId)} (${a.time}) và ${pname(b.productId)} (${b.time}) chỉ cách ${Math.abs(ta-tb)} phút. ${r.why} Nên cách ít nhất ${r.min/60} giờ.`,odsUrl(r.src),nt>=0?{plan:b.id,time:hhmm(nt)}:null)}
  for(const r of DRUG){if(!r.re.test(m.meds||''))continue;const hit=plans.filter(p=>r.n.some(k=>hasN(p,k)));
    if(hit.length)add(r.lv||3,'drug-'+r.id,r.title,`${r.text} Liên quan: ${[...new Set(hit.map(p=>pname(p.productId)))].join(', ')}. Hỏi bác sĩ hoặc dược sĩ.`,r.src?odsUrl(r.src):null,null,r.vault&&(kbHasName(r.vault)||S.notes.some(x=>norm(x.substance)===norm(r.vault)))?r.vault:null)}
  herbWarnings(m,plans,add);
  if(plans.length){
    if(!adult)add(2,'child','Chưa có mức cho trẻ em','Mức tối đa trong app là của người lớn. Trẻ em có mức thấp hơn nhiều, hãy hỏi bác sĩ nhi.');
    if(age==null)add(1,'noage','Chưa có năm sinh','App đang dùng mức tối đa của người lớn. Nhập năm sinh để tính đúng hơn.');
    if((m.meds||'').trim())add(1,'meds','Đang dùng thuốc kê đơn','App chỉ nhận ra vài tương tác phổ biến. Hãy đưa danh sách này cho bác sĩ hoặc dược sĩ xem cùng đơn thuốc.');
    else if(age!=null&&age>=65)add(1,'65','Trên 65 tuổi','Nên ghi thuốc kê đơn vào hồ sơ và hỏi bác sĩ trước khi thêm TPCN mới.')}
  return W.sort((a,b)=>b.lv-a.lv)}
function warnCard(w,showName){return`<div class="w w${w.lv}"><b>${LV[w.lv]} · ${esc(w.title)}</b>${showName?` <span class="mute">(${esc(mname(w.mid))})</span>`:''}<div>${esc(w.text)}</div>
  <div class="row" style="margin-top:6px;align-items:center">${w.src?`<a href="${esc(w.src)}" target="_blank" rel="noopener noreferrer" style="font-size:13px">Nguồn: ${/efsa|ncbi/.test(w.src)?'EFSA':/nccih/.test(w.src)?'NCCIH':'NIH'}</a>`:''}
  ${w.vault?`<button class="btn sm" data-n="${esc(w.vault)}" onclick="go('know',this.dataset.n)">${kbHasName(w.vault)?'Xem bài kiến thức':'Ghi chú của bạn'}</button>`:''}
  ${w.fix?`<button class="btn sm" onclick="applyFix('${w.fix.plan}','${w.fix.time}')">Dời giờ sang ${esc(w.fix.time)}</button>`:''}
  ${w.lv<3?`<button class="btn sm" onclick="dismissW('${w.mid}','${esc(w.key)}')">Bỏ qua</button>`:''}</div></div>`}
function applyFix(id,time){const p=byId(S.plans,id);if(p){p.time=time;save();render()}}
function dismissW(mid,key){S.dismissed=[...(S.dismissed||[]),mid+'|'+key];save();render()}
function todayWarnings(){const W=S.members.filter(m=>!fMember||m.id===fMember).flatMap(m=>warningsFor(m));
  const big=W.filter(w=>w.lv>=2),small=W.length-big.length;
  return big.map(w=>warnCard(w,!fMember)).join('')+(small?`<div class="mute" style="margin-bottom:8px">Còn ${small} lưu ý nhẹ, xem ở tab <a href="#" onclick="go('fam');return false">Gia đình</a>.</div>`:'')}
function memberHealth(m){const age=ageOf(m),t=Object.values(totals(m.id,today())),W=warningsFor(m);
  const rows=[];for(const e of t){const L=limitOf(e.key,age);if(!L)continue;
    if(L.amideUl!=null){rows.push([NUTR[e.key].n+' (nicotinic acid)',e.total-(e.amide||0),L.ul,L,e.unknown]);if(e.amide)rows.push(['Nicotinamide',e.amide,L.amideUl,L,false])}
    else rows.push([NUTR[e.key].n,e.total,L.ul,L,e.unknown])}
  const bars=rows.map(([n,tot,ul,L,unk])=>{const pc=tot/ul*100;
    return`<div style="margin-top:6px"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span>${esc(n)}${L.safe?' (mức an toàn)':''}</span><span>${unk?(tot?'≥ '+fmt(tot):'chưa rõ'):fmt(tot)} / ${fmt(ul)} ${L.u}</span></div><div class="bar"><i style="width:${Math.min(100,pc)}%;background:${pc>100?'var(--bad)':pc>=80?'var(--warn)':'var(--pri)'}"></i></div></div>`}).join('');
  return (bars?`<div style="margin-top:10px"><b style="font-size:14px">Tổng một ngày so với mức tối đa (${ulStd()==='efsa'?'EFSA':'NIH'})</b>${bars}</div>`:'')+(W.length?`<div style="margin-top:10px">${W.map(w=>warnCard(w,false)).join('')}</div>`:'')}

/* ---------- Hôm nay ---------- */
function slotsFor(day){
  const out=[];
  for(const p of S.plans){
    if(fMember&&p.memberId!==fMember)continue;
    if(p.start&&p.start>day)continue;if(p.end&&p.end<day)continue;
    if(!byId(S.members,p.memberId)||!byId(S.products,p.productId))continue;
    out.push({plan:p,intake:S.intakes.find(i=>i.planId===p.id&&i.date===day)});
  }
  return out.sort((a,b)=>(a.plan.time||'99').localeCompare(b.plan.time||'99'));
}
function setIntake(planId,status){
  const day=today();let i=S.intakes.find(x=>x.planId===planId&&x.date===day);
  if(i&&i.status===status){S.intakes.splice(S.intakes.indexOf(i),1)}
  else if(i){i.status=status;i.at=Date.now()}
  else S.intakes.push({id:uid(),planId,date:day,status,at:Date.now()});
  save();render();
}
const chipRow=()=>S.members.length?`<div class="chips"><button class="${!fMember?'on':''}" onclick="fMember='';render()">Cả nhà</button>${S.members.map(m=>`<button class="${m.id===fMember?'on':''}" onclick="fMember='${m.id}';render()">${esc(m.name)}</button>`).join('')}</div>`:'';
/* ---------- Nhắc giờ ----------
   Khi app đang mở, kiểm tra mỗi phút. Thông báo hệ thống chỉ hiện khi đã được cho phép. */
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
function dueNow(){const day=today(),n=nowMin();
  return slotsFor(day).filter(s=>{const t=mins(s.plan.time);return t!=null&&t<=n&&s.intake?.status!=='taken'&&s.intake?.status!=='skipped'})}
let lastPing='';
function checkReminders(){
  const due=dueNow();if(!due.length)return;
  const key=today()+'|'+due.map(s=>s.plan.id).join(',');
  if(key===lastPing)return;lastPing=key;
  if('Notification' in window&&Notification.permission==='granted'){
    try{new Notification('Đến giờ uống TPCN',{body:due.map(s=>mname(s.plan.memberId)+': '+pname(s.plan.productId)).join('\n'),tag:'tpcn-due'})}catch{}
  }
  if(tab==='today')render();
}
function askReminders(){
  if(!('Notification' in window)){alert('Trình duyệt này không hỗ trợ thông báo. Bạn vẫn thấy nhắc trong app khi mở.');return}
  Notification.requestPermission().then(p=>{alert(p==='granted'?'Đã bật thông báo. Khi app đang mở, sẽ có nhắc đúng giờ.':'Chưa bật được thông báo. Vẫn thấy nhắc trong app khi mở.');render()});
}
setInterval(checkReminders,60000);

function vToday(){
  const day=today(),sl=slotsFor(day),taken=sl.filter(s=>s.intake?.status==='taken').length;
  const due=dueNow(),dueIds=new Set(due.map(s=>s.plan.id));
  const perm='Notification' in window?Notification.permission:'unsupported';
  let html=chipRow()+(sl.length?`<div class="card" style="padding:12px 14px"><div style="display:flex;justify-content:space-between"><b>Hôm nay</b><span class="mute">${taken}/${sl.length} lượt đã uống</span></div><div class="bar" style="margin-top:8px"><i style="width:${Math.round(taken/sl.length*100)}%;background:var(--pri)"></i></div></div>`:'')+todayWarnings();
  if(due.length)html+=`<div class="note" style="margin-bottom:10px;border-color:var(--pri);background:var(--pri2);color:var(--pri)"><b>Đến giờ uống:</b> ${due.map(s=>esc(mname(s.plan.memberId))+' · '+esc(pname(s.plan.productId))).join(', ')}</div>`;
  if(perm==='default')html+=`<div class="row" style="margin:0 0 10px"><button class="btn sm" onclick="askReminders()">Bật thông báo giờ uống</button></div>`;
  let last=null;
  for(const s of sl){
    const p=s.plan,st=s.intake?.status,key=(p.time||'')+(p.label||'');
    if(key!==last){html+=`<div class="slot">${esc(p.label||'Trong ngày')} ${p.time?'· '+esc(p.time):''}</div>`;last=key}
    html+=`<div class="card dose ${st==='taken'?'done':''}" ${dueIds.has(p.id)?'style="border-color:var(--pri)"':''}><input type="checkbox" aria-label="Đã uống" ${st==='taken'?'checked':''} onchange="setIntake('${p.id}','taken')">
      <div class="grow"><div class="t"><b>${esc(pname(p.productId))}</b></div><div class="mute">${esc(mname(p.memberId))} · ${esc(p.qty||'')}${st==='skipped'?' · đã bỏ liều':''}</div></div>
      <button class="btn sm" onclick="setIntake('${p.id}','skipped')">${st==='skipped'?'Huỷ bỏ':'Bỏ liều'}</button></div>`;
  }
  html+=sl.length?'':`<div class="empty"><b style="display:block;font-size:18px;color:var(--ink);margin-bottom:6px">Chưa có lịch uống hôm nay</b>${S.members.length&&S.products.length?'Mở một sản phẩm trong tab Tủ thuốc và bấm “Thêm người uống”.':'Bắt đầu bằng hai bước: thêm thành viên, rồi thêm sản phẩm.'}
      <div class="row" style="justify-content:center;margin-top:14px">${S.members.length?'':`<button class="btn pri" onclick="go('fam')">+ Thêm thành viên</button>`}${S.products.length?'':`<button class="btn ${S.members.length?'pri':''}" onclick="go('add')">+ Thêm sản phẩm</button>`}${S.members.length&&S.products.length?`<button class="btn pri" onclick="go('shelf')">Mở Tủ thuốc</button>`:''}</div></div>`;
  view('Hôm nay',fmtDay(),html);
}

/* ---------- Tủ TPCN ---------- */
function vShelf(){
  if(sub)return vProduct(sub);
  const l=S.products;
  view('Tủ thuốc',l.length+' sản phẩm',`<div class="row" style="margin:0 0 10px"><button class="btn pri" onclick="go('add')">+ Thêm sản phẩm</button><button class="btn" onclick="go('set')">Cập nhật từ file</button></div>`+overlapHtml()+
    (l.map(p=>{const who=[...new Set(S.plans.filter(x=>x.productId===p.id&&(!x.end||x.end>=today())).map(x=>mname(x.memberId)))];
      return`<div class="card" onclick="go('shelf','${p.id}')" style="cursor:pointer;display:flex;gap:12px;align-items:center">${thumbHtml(p,64)}<div class="grow"><h3>${esc(p.name)}</h3>
      <div class="mute">${esc([p.brand,p.form].filter(Boolean).join(' · '))}</div>
      <div>${who.length?`<span class="tag">Đang uống: ${esc(who.join(', '))}</span>`:''}${p.warnings?`<span class="tag" style="background:none;color:var(--warn);border:1px solid var(--warn)">⚠ cảnh báo</span>`:''}</div></div></div>`}).join('')
     ||`<div class="empty">Tủ trống. Bấm “+ Thêm sản phẩm”.</div>`));
}
// Một dòng thành phần: tên bấm được (mở bài kiến thức), thanh % mức tối đa của người lớn
function ingRow(i){
  const key=nutrKey(i),s={name:i.name,key},has=kbKeyOf(s);
  const nm=has?`<a href="#" data-n="${esc(i.name)}" onclick="go('know',this.dataset.n);return false">${esc(i.name)}</a>`:`${esc(i.name)} <span class="mute" style="font-size:11px">(chưa có bài)</span>`;
  let bar='';const L=key?limitOf(key,null):null,v=key?toUnit(i.amount,i.unit,NUTR[key].u,key):null;
  if(L&&v!=null&&counts(i,key)){const ul=L.amideUl!=null&&isAmide(i)?L.amideUl:L.ul,pc=v/ul*100;
    bar=`<div class="mute" style="font-size:11px">${Math.round(pc)}% ${L.safe?'mức an toàn':'mức tối đa'} ${L.by} (${fmt(ul)} ${L.u})</div><div class="bar"><i style="width:${Math.min(100,pc)}%;background:${pc>100?'var(--bad)':pc>=80?'var(--warn)':'var(--pri)'}"></i></div>`}
  return`<tr><td>${nm}${bar}</td><td>${esc(i.amount)} ${esc(i.unit)}</td><td>${esc(i.form)}</td></tr>`}
// Ảnh đại diện lọ (ảnh nhỏ lưu cùng dữ liệu sản phẩm)
const thumbHtml=(p,px)=>p.thumb?`<img src="${p.thumb}" alt="" style="width:${px}px;height:${px}px;object-fit:cover;border-radius:10px;flex:none">`:'';
function overlaps(m){const by={};
  for(const p of activePlans(m.id,today())){const pr=byId(S.products,p.productId);
    for(const g of pr.ingredients||[]){const k=ingKey(g);if(!k)continue;(by[k]=by[k]||{name:nutrKey(g)?NUTR[nutrKey(g)].n:g.name,ps:new Set()}).ps.add(pr.id)}}
  return Object.values(by).filter(e=>e.ps.size>1).map(e=>({name:e.name,ps:[...e.ps]}))}
function overlapHtml(){
  const rows=S.members.map(m=>{const o=overlaps(m);return o.length?`<div style="margin-top:6px"><b style="font-size:13px">${esc(m.name)}</b>${o.map(e=>`<div class="mute" style="font-size:13px">${esc(e.name)}: ${e.ps.map(pname).map(esc).join(', ')}</div>`).join('')}</div>`:''}).join('');
  return rows?`<div class="card"><b>Trùng nhau</b><div class="mute">Cùng một chất có trong nhiều sản phẩm mà người đó đang uống. Hãy cộng dồn khi so với mức tối đa.</div>${rows}</div>`:''}
function vProduct(id){
  const p=byId(S.products,id);if(!p){sub=null;return vShelf()}
  const plans=S.plans.filter(x=>x.productId===id);
  view(p.name,[p.brand,p.form].filter(Boolean).join(' · '),
   `<div class="row" style="margin:0 0 10px"><button class="btn" onclick="go('shelf')">‹ Tủ TPCN</button></div>
   ${p.thumb?`<div style="text-align:center;margin-bottom:10px">${thumbHtml(p,160)}</div>`:''}
   <div class="card"><b>Thành phần mỗi liều</b>${(p.ingredients||[]).length?`<table class="ing2"><tr><th>Hoạt chất</th><th>Lượng</th><th>Dạng</th></tr>${p.ingredients.map(ingRow).join('')}</table>`:'<div class="mute">Chưa nhập.</div>'}
    <div class="mute" style="margin-top:6px">Liều trên nhãn: ${esc(p.dosageLabel||'—')}</div></div>
   <div class="card"><b>Mua</b><div class="mute">${p.price!==''&&p.price!=null?esc(p.price)+' CZK · ':''}${esc(p.store||'')} ${safeUrl(p.url)?`<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">liên kết</a>`:''}</div></div>
   ${p.warnings?`<div class="note"><b>⚠ Cảnh báo trên nhãn</b><br>${esc(p.warnings)}</div>`:''}
   ${p.notes?`<div class="card"><b>Ghi chú</b><div class="mute">${esc(p.notes)}</div></div>`:''}
   ${(p.imageIds||[]).length?`<div class="card"><b>Ảnh nhãn</b><div id="pimgs" class="imgs" style="margin-top:6px"></div></div>`:''}
   ${p.text?`<details class="card"><summary><b>Văn bản gốc</b></summary><pre style="white-space:pre-wrap;font:13px/1.45 inherit;margin:8px 0 0">${esc(p.text)}</pre></details>`:''}
   <div class="card"><b>Ai đang uống</b>${plans.map(x=>`<div class="mute" style="display:flex;gap:8px;align-items:center"><span class="grow">${esc(mname(x.memberId))} · ${esc(x.qty||'')}${x.servings&&x.servings!=1?' ('+esc(x.servings)+' liều nhãn)':''} · ${esc(x.time||'')} ${esc(x.label||'')} · từ ${esc(x.start)}${x.end?' đến '+esc(x.end):''}</span>
     ${x.end?'':`<button class="btn sm" onclick="endPlan('${x.id}')">Dừng</button>`}<button class="btn sm del" onclick="remove(S.plans,'${x.id}')">Xoá</button></div>`).join('')||'<div class="mute">Chưa ai.</div>'}
    <div class="row"><button class="btn pri sm" onclick="editPlan('${id}')">+ Thêm người uống</button></div></div>
   <div class="row"><button class="btn" onclick="editProduct('${id}')">Sửa</button><button class="btn del" onclick="delProduct('${id}')">Xoá sản phẩm</button></div>`);
  loadImgs(p.imageIds,'#pimgs');
}
function endPlan(id){byId(S.plans,id).end=today();save();render()}
function delProduct(id){if(!confirm('Xoá sản phẩm và mọi lịch uống của nó?'))return;(byId(S.products,id)?.imageIds||[]).forEach(delImg);S.plans.filter(x=>x.productId===id).forEach(x=>{S.intakes=S.intakes.filter(i=>i.planId!==x.id)});S.plans=S.plans.filter(x=>x.productId!==id);S.products=S.products.filter(x=>x.id!==id);save();go('shelf')}
function editPlan(productId){
  if(!S.members.length){alert('Cần thêm thành viên ở tab Gia đình trước.');return}
  dialog('Thêm người uống',[{k:'memberId',l:'Ai uống',t:'sel',o:S.members.map(m=>[m.id,m.name])},{k:'qty',l:'Liều mỗi lần (vd: 1 viên)'},{k:'time',l:'Giờ uống',t:'time'},{k:'label',l:'Buổi (vd: Sáng, sau ăn)'},{k:'servings',l:'Bằng mấy liều ghi trên nhãn? (1 = đúng liều nhãn, dùng để cộng tổng)',t:'number'},{k:'start',l:'Bắt đầu',t:'date'}],
   {id:uid(),productId,memberId:S.members[0].id,time:'07:30',label:'Sáng, sau ăn',start:today(),qty:'1 viên',servings:1},o=>{if(!o.qty)return;upsert(S.plans,o)});
}

/* ---------- Thêm / sửa sản phẩm ---------- */
function newProduct(){addMsg='';draft=blank();go('add')}
function editProduct(id){addMsg='';draft=JSON.parse(JSON.stringify(byId(S.products,id)));draft.imageIds=draft.imageIds||[];if(!draft.ingredients.length)draft.ingredients=[{name:'',amount:'',unit:'mg',form:''}];go('add')}
const UNITS=['mg','mcg','g','IU','ml','CFU','%'];
function vAdd(){
  if(!draft)return vImport();
  const d=draft,isNew=!byId(S.products,d.id);
  view(isNew?'Thêm sản phẩm':'Sửa sản phẩm',addMsg||'Kiểm tra từng dòng trước khi lưu.',
   `<div class="card" style="display:grid;gap:10px">
    ${d.nih?nihCard(d.nih):''}
    <div id="imgs" class="imgs"></div>
    <div><label class="btn sm" style="display:inline-block">+ Thêm ảnh khác của sản phẩm này<input type="file" accept="image/*" multiple hidden onchange="addPhotosToDraft(this.files)"></label> <span class="mute" id="addst"></span></div>
    <label>Tên sản phẩm<input id="a_name" value="${esc(d.name)}"></label>
    <label>Hãng<input id="a_brand" value="${esc(d.brand)}"></label>
    <label>Dạng (viên, bột, nước…)<input id="a_form" value="${esc(d.form)}"></label>
    <div><div class="mute" style="margin-bottom:4px">Thành phần mỗi liều: mỗi hoạt chất một dòng</div>
     ${d.ingredients.some(g=>g.check)?'<div class="note" style="margin-bottom:6px">Ô viền cam: app đọc không chắc. Hãy đối chiếu với ảnh nhãn rồi sửa.</div>':''}
     ${d.ingredients.map((g,i)=>`<div class="ing"><input placeholder="Hoạt chất" aria-label="Hoạt chất" value="${esc(g.name)}" data-i="${i}" data-f="name">
       <input class="${g.check?'chk':''}" placeholder="Lượng" inputmode="decimal" aria-label="Lượng" value="${esc(g.amount)}" data-i="${i}" data-f="amount">
       <select aria-label="Đơn vị" data-i="${i}" data-f="unit">${UNITS.map(u=>`<option ${u===g.unit?'selected':''}>${u}</option>`).join('')}</select>
       <button class="btn sm del" aria-label="Xoá dòng" onclick="ingDel(${i})">×</button></div>`).join('')}
     <button class="btn sm" onclick="ingAdd()">+ Thêm dòng</button></div>
    <label>Liều ghi trên nhãn<input id="a_dosageLabel" value="${esc(d.dosageLabel)}"></label>
    <div class="ing" style="grid-template-columns:1fr 1fr"><label>Giá (CZK)<input id="a_price" type="number" step="any" value="${esc(d.price)}"></label><label>Nơi mua<input id="a_store" value="${esc(d.store)}"></label></div>
    <label>Link<input id="a_url" value="${esc(d.url)}"></label>
    <label>Cảnh báo trên nhãn<textarea id="a_warnings">${esc(d.warnings)}</textarea></label>
    <label>Ghi chú<textarea id="a_notes">${esc(d.notes)}</textarea></label>
    <div class="row"><button class="btn pri" onclick="saveProduct()">Lưu sản phẩm</button><button class="btn" onclick="draft=null;go('shelf')">Huỷ</button></div></div>`);
  loadImgs(d.imageIds,'#imgs');
  $('#view').oninput=e=>{const t=e.target;
    if(t.dataset.f!==undefined){const g=d.ingredients[t.dataset.i];g[t.dataset.f]=t.value;if(t.dataset.f==='amount'){g.check=false;t.classList.remove('chk')}}
    else if(t.id?.startsWith('a_'))d[t.id.slice(2)]=t.value};
}
function ingAdd(){draft.ingredients.push({name:'',amount:'',unit:'mg',form:''});vAdd()}
function ingDel(i){draft.ingredients.splice(i,1);if(!draft.ingredients.length)ingAdd();else vAdd()}
function saveProduct(){
  const d=draft;if(!d.name.trim()){alert('Cần nhập tên sản phẩm.');return}
  d.name=d.name.trim();delete d.nih;d.price=d.price===''?'':Number(d.price);
  d.ingredients=d.ingredients.filter(g=>g.name.trim()).map(g=>({...g,name:g.name.trim(),amount:g.amount===''?'':Number(String(g.amount).replace(',','.'))})).map(({check,...g})=>g);
  if(d.ingredients.some(g=>g.amount!==''&&Number.isNaN(g.amount))){alert('Có lượng hoạt chất không phải số. Hãy sửa lại.');return}
  const id=d.id;draft=null;addMsg='';
  const i=S.products.findIndex(x=>x.id===id);i<0?S.products.push(d):S.products[i]=d;save();go('shelf',id);
}

/* ---------- Nhập từ ảnh / link / chữ ---------- */
let stage={title:'',source:'',text:'',images:[]},addMsg='';
const blank=()=>({id:uid(),name:'',brand:'',form:'',dosageLabel:'',price:'',store:'',url:'',warnings:'',notes:'',text:'',imageIds:[],ingredients:[{name:'',amount:'',unit:'mg',form:''}]});
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('Không đọc được ảnh'));im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};im.src=r.result};r.readAsDataURL(file)})}

async function ocr(urls,log){

  const w=await Tesseract.createWorker('eng+ces+vie',1,{logger:m=>{if(m.status==='recognizing text')log('Đang đọc chữ… '+Math.round(m.progress*100)+'%')}});

/* Xử lý ảnh trước khi đọc chữ: phóng to, chuyển xám, kéo giãn độ tương phản.
   Cách "flat" còn chia cho nền đã làm mờ để khử bóng đổ. Thử cả hai, giữ kết quả tách được nhiều hoạt chất hơn. */
const loadImg=u=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>j(new Error('Không đọc được ảnh'));i.src=u});
async function prepImage(url,flat){
  const im=await loadImg(url),k=Math.max(1,Math.min(2.5,1800/Math.max(im.width,im.height))),W=Math.round(im.width*k),H=Math.round(im.height*k);
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(im,0,0,W,H);
  let B=null;
  if(flat){const sm=document.createElement('canvas');sm.width=Math.max(8,W>>4);sm.height=Math.max(8,H>>4);sm.getContext('2d').drawImage(c,0,0,sm.width,sm.height);
    const bg=document.createElement('canvas');bg.width=W;bg.height=H;const bx=bg.getContext('2d');bx.filter='blur(6px)';bx.drawImage(sm,0,0,W,H);B=bx.getImageData(0,0,W,H).data}
  const d=x.getImageData(0,0,W,H),p=d.data,n=W*H,g=new Uint8Array(n),h=new Uint32Array(256);
  for(let i=0;i<n;i++){let v=p[4*i]*.299+p[4*i+1]*.587+p[4*i+2]*.114;
    if(B)v=Math.min(255,v/Math.max(1,B[4*i]*.299+B[4*i+1]*.587+B[4*i+2]*.114)*235);
    v|=0;g[i]=v;h[v]++}
  const cut=n*(flat?.02:.01);let lo=0,hi=255,a=0;while(lo<255&&(a+=h[lo])<cut)lo++;a=0;while(hi>0&&(a+=h[hi])<cut)hi--;
  const s=hi>lo?255/(hi-lo):1;
  for(let i=0;i<n;i++)p[4*i]=p[4*i+1]=p[4*i+2]=Math.max(0,Math.min(255,(g[i]-lo)*s));
  x.putImageData(d,0,0);return c.toDataURL('image/png')}
async function ocrBest(urls,log){
  const outs=[];
  for(const [i,u] of urls.entries()){
    log(`Ảnh ${i+1}/${urls.length}: xử lý ảnh…`);
    const cands=[];let err=null;
    for(const flat of [false,true]){try{const t=await ocr([await prepImage(u,flat)],log),f=parseFacts(t).ingredients;cands.push({t,n:f.length,c:f.filter(g=>g.check).length})}catch(e){err=e}}
    if(!cands.length)throw err||new Error('Không đọc được ảnh');
    cands.sort((a,b)=>b.n-a.n||a.c-b.c||b.t.length-a.t.length);outs.push(cands[0].t)}
  return outs.join('\n\n')}

/* Tách thành phần từ chữ trên nhãn. Chỉ gợi ý: người dùng luôn phải soát lại. */
const UNIT_MAP={mg:'mg',mcg:'mcg','µg':'mcg','μg':'mcg',ug:'mcg',g:'g',iu:'IU',ml:'ml',cfu:'CFU'};
const ING_RE=/^(.*?)[\s:.\-–]*((?=[0-9OolI.,]*\d)[0-9OolI]+(?:[.,][0-9OolI]+)?)\s*(mg|mcg|µg|μg|ug|g|iu|ml|cfu)\b(.*)$/i;
const HEAD={other:/^(other ingredients?|ostatní složky|další složky|thành phần khác)\s*[:.\-]?\s*/i,warn:/^(warnings?|caution|upozornění|cảnh báo)\s*[:.\-]?\s*/i,dir:/^(suggested use|directions?|dosage|doporučené dávkování|dávkování|použití|cách dùng|liều dùng)\s*[:.\-]?\s*/i,serv:/^(serving size|velikost porce|khẩu phần)\s*[:.\-]?\s*/i};
function parseFacts(raw){
  const out={ingredients:[],other:'',warnings:'',directions:'',serving:''};
  const sec={other:'other',warn:'warnings',dir:'directions'};
  let cur=null;
  for(const l of raw.replace(/ /g,' ').split(/\r?\n/).map(s=>s.trim())){
    if(!l){cur=null;continue}
    let hit=false;
    for(const k of ['serv','other','warn','dir']){const m=l.match(HEAD[k]);if(m){hit=true;const rest=l.slice(m[0].length);
      if(k==='serv'){out.serving=rest;cur=null}else{cur=sec[k];out[cur]+=(out[cur]?' ':'')+rest}break}}
    if(hit)continue;
    if(cur){out[cur]+=(out[cur]?' ':'')+l;continue}
    const m=ING_RE.exec(l);if(!m)continue;
    let name=m[1].replace(/[\s:.\-–,*]+$/,'').trim(),form='';
    const pm=name.match(/\(([^)]*)\)/);if(pm){form=pm[1].replace(/^(as|from|z|ve formě)\s+/i,'').trim();name=name.replace(pm[0],'').replace(/\s+/g,' ').trim()}
    if(!name||/serving|daily value|calor|%\s*dv/i.test(name))continue;
    const rawNum=m[2];let check=/[OolI]/.test(rawNum);
    let amount=Number(rawNum.replace(/[Oo]/g,'0').replace(/[lI]/g,'1').replace(',','.'));
    if(Number.isNaN(amount)){amount='';check=true}
    out.ingredients.push({name,amount,unit:UNIT_MAP[m[3].toLowerCase()]||'mg',form,check});
  }
  return out;
}

  d.dosageLabel=(f.directions||f.serving).trim();d.warnings=f.warnings.trim();

    const pr=findPrice(raw);if(pr){if(pr.czk!=null)d.price=pr.czk;d.notes=(d.notes?d.notes+'\n':'')+'Giá lấy tự động từ trang: '+pr.text+' (hãy kiểm tra lại).'}}

  const nih=await nihMatch(d,stage);if(nih){d.nih=nih;addMsg+=' Có nhãn NIH khớp, xem khung xanh bên dưới.'}

/* ---------- Tự đối chiếu với kho NIH, tên, giá ---------- */
function cleanTitle(t){
  let s=String(t||'').split(/\s[|–—]\s|\s-\s/)[0];
  s=s.replace(/,?\s*\b\d+\s*(?:capsules?|caps|tablets?|softgels?|veggie\s*caps?|vcaps?|count|ct|pcs|viên|tobolek|kapslí|tablet)\b.*$/i,'');
  return s.replace(/\s+/g,' ').replace(/[,\s]+$/,'').trim().slice(0,100)}
function findPrice(t){
  let m=String(t||'').match(/(\d{1,3}(?:[ . ]\d{3})*|\d+)(?:[.,]\d{1,2})?\s*(?:Kč|CZK)/i);
  if(m){const num=Number(m[0].replace(/\s*(Kč|CZK)/i,'').replace(/[ . ](?=\d{3}\b)/g,'').replace(',','.'));if(num>0&&num<100000)return{czk:num,text:m[0].trim()}}
  m=String(t||'').match(/(?:\$|€|£)\s?\d+(?:[.,]\d{2})?|\d+(?:[.,]\d{2})?\s?(?:€|EUR|USD)/i);
  return m?{czk:null,text:m[0].trim()}:null}
const ingKey=g=>nutrKey(g)||norm(g.name).replace(/[^a-z0-9à-ỹ]+/g,' ').trim();
function compareIngs(photo,nih){
  const idx=new Map();for(const g of nih){const k=ingKey(g);if(k&&!idx.has(k))idx.set(k,g)}
  let ok=0,matched=0;const diffs=[],marks=[],seen=new Set();
  for(const g of photo){const k=ingKey(g),o=idx.get(k);
    if(!o){diffs.push(`${g.name}: có trong ảnh nhưng không có trong NIH`);continue}
    seen.add(k);matched++;
    const nk=nutrKey(g),a=nk?toUnit(g.amount,g.unit,o.unit,nk):(g.unit===o.unit?Number(g.amount):null),b=Number(o.amount);
    if(a==null||!b){ok+=.5;continue}
    if(Math.abs(a-b)/b<=0.03)ok++;else{diffs.push(`${g.name}: ảnh ${g.amount} ${g.unit}, NIH ${o.amount} ${o.unit}`);marks.push(g)}}
  return{score:photo.length?ok/photo.length:0,matched,diffs,marks,onlyNih:[...idx.keys()].filter(k=>!seen.has(k)).length}}
function nihQueries(stg){
  const qs=[],t=cleanTitle(stg.title);if(t)qs.push(t.replace(/,/g,' '));
  const lines=String(stg.text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const stop=lines.findIndex(l=>/supplement facts|amount per serving|serving size|nutrition facts|údaje o výživě/i.test(l));
  const head=(stop<0?lines.slice(0,4):lines.slice(0,stop)).filter(l=>l.length>=4&&l.length<=60&&(l.match(/[A-Za-zÀ-ỹ]/g)||[]).length/l.length>.7).slice(0,3);
  if(head.length)qs.push(head.join(' '));
  return [...new Set(qs)]}
async function nihMatch(d,stg){
  const photo=d.ingredients.filter(g=>g.name&&g.amount!=='');
  if(photo.length<2)return null;
  const st=m=>{const e=$('#st');if(e)e.textContent=m};
  const run=async()=>{
    st('Đối chiếu với kho NIH…');let best=null;
    for(const q of nihQueries(stg)){
      const hits=(await dsldSearch(q)).sort((a,b)=>(a.off?1:0)-(b.off?1:0)).slice(0,4);
      for(const h of hits){const cand=await dsldDraft(h.id),cmp=compareIngs(photo,cand.ingredients);
        if(!best||cmp.score>best.cmp.score)best={h,cand,cmp}}
      if(best&&best.cmp.score>=.8)break}
    if(!best||best.cmp.score<.5||best.cmp.matched<2)return null;
    best.cmp.marks.forEach(g=>g.check=true);
    const c=best.cand;
    return{id:best.h.id,name:c.name,brand:c.brand,score:best.cmp.score,diffs:best.cmp.diffs.slice(0,8),onlyNih:best.cmp.onlyNih,
      draft:{ingredients:c.ingredients,dosageLabel:c.dosageLabel,warnings:c.warnings,notes:c.notes,form:c.form,url:c.url}}};
  try{return await Promise.race([run(),new Promise(r=>setTimeout(()=>r(null),15000))])}catch{return null}}

/* ---------- Kho NIH DSLD: nhãn thực phẩm chức năng Mỹ ---------- */
const DSLD='https://api.ods.od.nih.gov/dsld/v9/';
async function dsldSearch(q){

  const d=await r.json();return (d.hits||[]).map(h=>({id:h._id,brand:h._source.brandName||'',name:h._source.fullName||'',off:h._source.offMarket,form:h._source.physicalState?.langualCodeDescription||'',date:h._source.entryDate||''}))}
const DUNIT={mg:'mg',mcg:'mcg','mcg rae':'mcg','mcg dfe':'mcg','mg ne':'mg','mg ate':'mg','mg at':'mg','mcg re':'mcg',g:'g',gram:'g',iu:'IU',ml:'ml',cfu:'CFU','billion cfu':'CFU'};
async function dsldDraft(id){
  const r=await fetch(DSLD+'label/'+id);if(!r.ok)throw new Error('NIH trả lỗi '+r.status);
  const L=await r.json(),d=blank();
  d.name=L.fullName||'';d.brand=L.brandName||'';d.form=L.physicalState?.langualCodeDescription||'';d.url='https://dsld.od.nih.gov/label/'+L.id;
  const rows=[];
  for(const row of L.ingredientRows||[]){rows.push(row);for(const n of row.nestedRows||[])rows.push(n)}
  d.ingredients=rows.map(row=>{
    const q=(row.quantity||[])[0],uraw=(q?.unit||'').trim(),ul=uraw.toLowerCase(),u=DUNIT[ul];
    let amount=q&&typeof q.quantity==='number'&&q.quantity>0?q.quantity:'';
    if(amount!==''&&/billion/.test(ul))amount*=1e9;
    const forms=(row.forms||[]).map(f=>f.name).filter(Boolean).join(', ');
    const qual=uraw&&u&&uraw.toLowerCase()!==u.toLowerCase()?' ('+uraw+')':'';
    return{name:row.name||row.ingredientGroup||'',amount:u?amount:'',unit:u||'mg',form:(forms+qual).trim(),check:amount===''||!u};
  }).filter(g=>g.name);
  if(!d.ingredients.length)d.ingredients=[{name:'',amount:'',unit:'mg',form:''}];
  const ss=(L.servingSizes||[])[0],dir=(L.statements||[]).find(s=>/Directions/i.test(s.type));
  const rng=(a,b)=>a&&b&&a!==b?a+'–'+b:(a||b||'');
  d.dosageLabel=[ss?`1 liều nhãn = ${rng(ss.minQuantity,ss.maxQuantity)} ${ss.unit}${ss.minDailyServings||ss.maxDailyServings?`, ${rng(ss.minDailyServings,ss.maxDailyServings)} lần/ngày`:''}`:'',dir?.notes||''].filter(Boolean).join('. ');
  d.warnings=(L.statements||[]).filter(s=>/^Precaution/i.test(s.type)).map(s=>s.notes).filter(Boolean).join('\n');
  const oi=L.otheringredients,oit=typeof oi==='string'?oi:(oi?.text||'');
  d.notes=`Nguồn: NIH DSLD #${L.id}, nhãn Mỹ nhập ${L.entryDate||'?'}.`+(oit?'\nThành phần khác: '+oit:'');
  d.nihId=L.id;
  return d;
}

function cleanDeep(v,depth=0){
  if(typeof v==='string')return v.slice(0,900);

  if(depth>4)return '';
  if(Array.isArray(v))return v.slice(0,80).map(x=>cleanDeep(x,depth+1));
  if(v&&typeof v==='object'){const o={};for(const k of Object.keys(v).slice(0,40))if(/^[a-zA-Z]{1,24}$/.test(k))o[k]=cleanDeep(v[k],depth+1);return o}
  return ''}

  dialog(id?'Sửa nhật ký':'Thêm nhật ký',[{k:'date',l:'Ngày',t:'date'},{k:'weight',l:'Cân nặng (kg)',t:'number'},{k:'hr',l:'Nhịp tim lúc nghỉ (lần/phút)',t:'number'},{k:'bp',l:'Huyết áp (vd: 120/80)'},{k:'symptom',l:'Triệu chứng (bồn chồn, đau bụng, mất ngủ...)'},{k:'note',l:'Ghi chú (thuốc đã đổi, kết quả khám...)',t:'area'}],e,

const DOC_LV={khop:['Khớp bài trong app','#0f766e'],ykien:['Ý kiến tác giả','#1d4ed8'],chuakc:['Chưa kiểm chứng','#6b7280'],trai:['Trái khuyến cáo chính thức','#9a3412']};

async function importDocs(f){
  if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(!d||d.kind!=='tpcn-docs'||d.v!==1||!Array.isArray(d.docs))throw new Error('Không đúng định dạng file tài liệu');
    const ok=d.docs.filter(x=>x&&typeof x.id==='string'&&/^doc-[a-z0-9-]{1,60}$/.test(x.id)&&typeof x.title==='string');
    if(!ok.length)throw new Error('Không có tài liệu hợp lệ trong file');
    S.docs=S.docs||[];
    const upd=ok.filter(x=>byId(S.docs,x.id)).length;
    if(!confirm(`Nhập ${ok.length} tài liệu (${upd} bài đã có sẽ được cập nhật). Tiếp tục?`))return;
    for(const x of ok){const o=cleanDeep(x);o.original=typeof x.original==='string'?x.original.slice(0,200000):'';o.source=cleanStr(d.source,120);const i=S.docs.findIndex(y=>y.id===o.id);i<0?S.docs.push(o):S.docs[i]=o}
    save();syncDocsSheet(false);go('know','d:');alert(`Đã nhập ${ok.length} tài liệu.`);
  }catch(e){alert('Lỗi: '+e.message)}
}

/* ---------- Cửa duy nhất: Cập nhật dữ liệu (tự nhận dạng loại file, xếp đúng mục) ---------- */
const UPDATE_KINDS={'tpcn-products':importProducts,'tpcn-profile':importProfile,'tpcn-knowledge':importKnowledge,'tpcn-docs':importDocs};
async function updateFiles(files){
  for(const f of [...files]){
    try{
      const d=JSON.parse(await f.text());
      if(d&&!d.kind&&d.v===2&&Array.isArray(d.members)&&Array.isArray(d.products)){await restore(f);continue}
      const fn=d&&UPDATE_KINDS[d.kind];
      if(!fn){alert(`File "${f.name}" không nhận dạng được loại dữ liệu (cần sản phẩm, hồ sơ sức khỏe, kiến thức, tài liệu hoặc bản sao lưu).`);continue}
      await fn(f);
    }catch(e){alert(`Không đọc được "${f.name}": ${e.message}`)}
  }
}

const hsh=o=>{const s=stable(o);let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};

async function gApi(path,opt={}){

async function gEnsureTabs(){

  const have=new Set((meta.sheets||[]).map(s=>s.properties.title));
  const add=SYNC_TABS.filter(t=>!have.has(t.tab)).map(t=>({addSheet:{properties:{title:t.tab}}}));
  if(add.length)await gApi(':batchUpdate',{method:'POST',body:JSON.stringify({requests:add})})}
const colLetter=n=>String.fromCharCode(64+n);
/* Tính kết quả gộp cho một bảng. Không ghi gì cả. */
function mergeTab(t,locList,rows,base){
  const L={},R={};
  for(const x of locList)L[x.id]=t.pub(x);
  for(const row of rows){try{const j=JSON.parse(row[t.cols.length]||'');if(j&&typeof j.id==='string')R[j.id]=j}catch(e){}}
  const ids=new Set([...Object.keys(L),...Object.keys(R)]);
  const out={keep:{},stats:{up:0,down:0,delLocal:0,conflict:0,same:0},conflicts:[],skipDelLocal:[]};
  for(const id of ids){
    const l=L[id],r=R[id],b=base[id],hl=l?hsh(l):null,hr=r?hsh(r):null;
    if(l&&r){
      if(hl===hr){out.keep[id]=l;out.stats.same++}
      else if(b===undefined||(hl!==b&&hr!==b)){out.conflicts.push({id,l,r});out.stats.conflict++}
      else if(hl===b){out.keep[id]=r;out.stats.down++}
      else{out.keep[id]=l;out.stats.up++}
    }else if(l&&!r){
      if(b!==undefined&&hl===b){out.stats.delLocal++;out.skipDelLocal.push(id)} // đã bị xoá ở nơi khác
      else{out.keep[id]=l;out.stats.up++}
    }else if(!l&&r){
      if(b!==undefined&&hr===b){/* đã xoá ở máy này: không gửi lại */}
      else{out.keep[id]=r;out.stats.down++}
    }
  }
  return out}
async function syncAll(){
  try{
    if(!GSYNC.token||Date.now()>GSYNC.exp)await gLogin();
    await gEnsureTabs();
    const got=await gApi('/values:batchGet?'+SYNC_TABS.map(t=>'ranges='+t.tab+'!A2:'+colLetter(t.cols.length+2)+'2000').join('&'));
    S.sync=S.sync||{};
    const plan=[];let up=0,down=0,del=0,conf=0;
    SYNC_TABS.forEach((t,i)=>{
      const loc=(S[t.key]||[]).filter(t.filter||(()=>true));
      const m=mergeTab(t,loc,(got.valueRanges[i].values||[]),S.sync[t.key]||{});
      plan.push({t,m});up+=m.stats.up;down+=m.stats.down;del+=m.stats.delLocal;conf+=m.stats.conflict});
    // Xử lý xung đột: hỏi từng mục
    for(const {t,m} of plan)for(const c of m.conflicts){
      const label=c.l.name||c.l.title||c.l.date||c.id;
      m.keep[c.id]=confirm(`Mục "${label}" (${t.tab}) khác nhau giữa máy này và Google Sheet.\nOK = giữ bản trên máy này.\nHuỷ = lấy bản trên Sheet.`)?c.l:c.r}
    if(!confirm(`Đồng bộ với Google Sheet:\n- Gửi lên: ${up}\n- Lấy về: ${down}\n- Xoá trên máy này (đã xoá ở nơi khác): ${del}\n- Xung đột đã chọn: ${conf}\nTiếp tục?`))return;
    // Áp dụng về máy
    let skipped=0;const newBase={};
    for(const {t,m} of plan){
      const cur=S[t.key]||[];const excl=cur.filter(x=>!(t.filter||(()=>true))(x)); // phần không đồng bộ (ghi chú Obsidian)
      const byId0=Object.fromEntries(cur.map(x=>[x.id,x]));
      const next=[];const pushOnly=[];
      for(const id of Object.keys(m.keep)){
        let rec=m.keep[id];
        if(byId0[id]&&hsh(t.pub(byId0[id]))===hsh(rec))rec=byId0[id]; // bản máy này thắng: giữ nguyên, không cắt bớt
        else if(t.key==='members'&&byId0[id])rec={...byId0[id],...rec}; // lấy từ Sheet nhưng giữ phần riêng tư của máy này
        if(!byId0[id]){ // bản ghi mới từ Sheet: chỉ nhận khi đã có thứ nó tham chiếu
          if(t.key==='plans'&&!byId(S.products,rec.productId)){skipped++;pushOnly.push(rec);continue}
          if(t.key==='intakes'&&!byId(S.plans,rec.planId)){skipped++;pushOnly.push(rec);continue}
          if(t.key==='members')rec={conditions:'',meds:'',allergies:'',...rec}}
        next.push(rec)}
      m.pushOnly=pushOnly;S[t.key]=[...excl,...next]}
    // Gửi bản đã gộp lên Sheet
    for(const {t,m} of plan){
      const final=[...(S[t.key]||[]).filter(t.filter||(()=>true)).map(t.pub),...m.pushOnly];
      const rows=final.map(r=>[...t.cols.map(c=>{const v=r[c];return v==null?'':typeof v==='object'?JSON.stringify(v):v}),JSON.stringify(r),hsh(r)]);
      const head=[...t.cols,'json','hash'];
      await gApi('/values/'+t.tab+'!A1:'+colLetter(head.length)+'2000:clear',{method:'POST'});
      await gApi('/values/'+t.tab+'!A1?valueInputOption=RAW',{method:'PUT',body:JSON.stringify({values:[head,...rows]})});
      const base={};for(const r of (S[t.key]||[]).filter(t.filter||(()=>true)).map(t.pub))base[r.id]=hsh(r);newBase[t.key]=base}
    S.sync=newBase;save();render();
    await syncDocsSheet(false);
    alert('Đồng bộ xong.'+(skipped?`\nBỏ qua ${skipped} lịch uống vì máy này chưa có sản phẩm tương ứng. Hãy cập nhật file sản phẩm trước rồi đồng bộ lại.`:''));
  }catch(e){alert('Đồng bộ lỗi: '+e.message)}
}

/* ---------- Khởi động ---------- */
load().then(render);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
