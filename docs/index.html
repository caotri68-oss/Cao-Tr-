<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ TPCN">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sổ TPCN gia đình</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#5b6573;--line:#e3e7ec;--pri:#0f766e;--pri2:#ccfbf1;--warn:#9a3412;--warnbg:#fff7ed;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--ink:#e6ebf1;--mute:#9aa7b8;--line:#2a3441;--pri:#2dd4bf;--pri2:#123a38;--warn:#fbbf24;--warnbg:#2b2210;--bad:#f87171}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
header{background:var(--card);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:6px}
header .hd{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
header .sub{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0}
header .ver{border:0;background:none;color:var(--mute);font-size:11px;padding:6px 4px;cursor:pointer;opacity:.85}
header .gear{border:0;background:none;color:var(--mute);width:40px;height:40px;display:grid;place-items:center;cursor:pointer;border-radius:10px;flex:none}
header .gear.on{color:var(--pri)}
header .gear svg,nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px;max-width:720px;width:100%;margin:0 auto}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;color:var(--mute);padding:8px 0 6px;font:inherit;font-size:12px;font-weight:500;min-height:58px;cursor:pointer;display:grid;justify-items:center;gap:2px}
nav button.on{color:var(--pri);font-weight:700}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
textarea{min-height:90px;resize:vertical}
label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:12px;cursor:pointer;min-height:44px;font-weight:500}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#06201d}}
.btn.sm{padding:6px 12px;font-size:14px;min-height:38px;border-radius:10px}
.btn.del{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 3px;font-size:17px}
.mute{color:var(--mute);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;min-height:42px;white-space:nowrap;cursor:pointer}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.chips button.on{color:#06201d}}
.slot{font-size:15px;font-weight:700;color:var(--pri);margin:18px 0 8px}
.dose{display:flex;align-items:center;gap:12px}
.dose input[type=checkbox]{width:30px;height:30px;min-height:0;accent-color:var(--pri);flex:none}
.dose.done .t{text-decoration:line-through;color:var(--mute)}
.grow{flex:1;min-width:0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:999px;padding:2px 10px;font-size:13px;margin:2px 4px 2px 0}
.empty{text-align:center;color:var(--mute);padding:36px 8px}
.ing{display:grid;grid-template-columns:1fr 70px 70px 28px;gap:6px;margin-bottom:6px}
table.ing2{width:100%;border-collapse:collapse;font-size:14px}
table.ing2 td,table.ing2 th{text-align:left;padding:4px 6px 4px 0;border-bottom:1px solid var(--line)}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,94vw);background:var(--card);color:var(--ink);max-height:92vh}
dialog::backdrop{background:#0008}
dialog form{padding:16px;display:grid;gap:10px}
.imgs{display:flex;gap:6px;flex-wrap:wrap}.imgs img{height:70px;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.ing input.chk{border:2px solid var(--warn);background:var(--warnbg)}
#report{display:none}
@media print{header,main,nav,dialog{display:none!important}#report{display:block;font:12pt/1.4 system-ui,sans-serif;color:#000}body{display:block;background:#fff}#report table{width:100%;border-collapse:collapse}#report th,#report td{border:1px solid #444;padding:4px;text-align:left;vertical-align:top;font-size:10.5pt}}
.w{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;margin-bottom:10px}
.w3{background:#fef2f2;border-color:#f5b5b5;color:#7f1d1d}.w2{background:var(--warnbg);border-color:var(--warn)}.w1{background:var(--bg)}
@media (prefers-color-scheme:dark){.w3{background:#3b1414;border-color:#7f1d1d;color:#fecaca}}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:8px}
.note{background:var(--warnbg);border:1px solid var(--warn);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px}

/* ---------- Giao diện mới: nền gradient, thẻ bo tròn, ô truy cập nhanh ---------- */
:root{--g1:#d9f2ef;--g2:#e4ecfb;--sh:0 6px 22px rgba(15,70,80,.09);--hero1:#0f766e;--hero2:#0e7490;
 --t1:#dbeafe;--t1i:#2563eb;--t2:#ccfbf1;--t2i:#0f766e;--t3:#ede9fe;--t3i:#7c3aed;--t4:#ffedd5;--t4i:#c2410c;--t5:#fee2e2;--t5i:#b91c1c;--t6:#dcfce7;--t6i:#15803d}
@media (prefers-color-scheme:dark){:root{--g1:#0e2a2b;--g2:#111f38;--sh:0 6px 22px rgba(0,0,0,.4);--hero1:#115e59;--hero2:#155e75;
 --t1:#172554;--t1i:#93c5fd;--t2:#0f3b38;--t2i:#5eead4;--t3:#2e1f5a;--t3i:#c4b5fd;--t4:#3a2210;--t4i:#fdba74;--t5:#3b1616;--t5i:#fca5a5;--t6:#12341e;--t6i:#86efac}}
body{background:linear-gradient(180deg,var(--g1) 0,var(--g2) 240px,var(--bg) 480px) no-repeat,var(--bg)}
header{background:transparent;border-bottom:0}
header h1{font-size:22px}
.card{border-radius:18px;box-shadow:var(--sh)}
.btn{border-radius:14px}
nav{margin:0 10px calc(8px + env(safe-area-inset-bottom));border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding-bottom:0;overflow:hidden}
nav button.on{box-shadow:inset 0 -3px 0 var(--pri)}
.hsearch{position:relative;margin:2px 0 14px}
.hsearch input{border-radius:16px;padding:13px 48px 13px 44px;box-shadow:var(--sh);border-color:transparent;font-size:16px}
.hsearch .hs-i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute);display:grid}
.hsearch svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hsearch .hs-go{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:18px;cursor:pointer}
@media (prefers-color-scheme:dark){.hsearch .hs-go{color:#06201d}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{border:0;border-radius:18px;padding:12px 4px 10px;display:grid;justify-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;box-shadow:var(--sh);background:var(--card)}
.tile:active{transform:scale(.97)}
.tile .ti{width:46px;height:46px;border-radius:15px;display:grid;place-items:center}
.tile svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.t1 .ti{background:var(--t1);color:var(--t1i)}.t2 .ti{background:var(--t2);color:var(--t2i)}.t3 .ti{background:var(--t3);color:var(--t3i)}.t4 .ti{background:var(--t4);color:var(--t4i)}.t5 .ti{background:var(--t5);color:var(--t5i)}.t6 .ti{background:var(--t6);color:var(--t6i)}
.hero{display:flex;align-items:center;gap:16px;border-radius:22px;padding:18px;margin-bottom:16px;color:#fff;background:linear-gradient(135deg,var(--hero1),var(--hero2));box-shadow:0 10px 26px rgba(15,100,110,.28)}
.ringw{position:relative;width:78px;height:78px;flex:none}
.ringw svg{width:78px;height:78px;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:8;stroke-linecap:round}
.ringw .rb{stroke:rgba(255,255,255,.28)}.ringw .rf{stroke:#fff}
.ringw b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px}
.hero-k{font-size:13px;opacity:.85;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.hero-n{font-size:20px;font-weight:700;line-height:1.25;margin-top:2px}
.hero-s{font-size:14px;opacity:.92;margin-top:4px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 10px}
.sec h2{margin:0;font-size:18px}
.sec a{font-size:14px;color:var(--pri);cursor:pointer;font-weight:600}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity}
.mem{flex:0 0 190px;scroll-snap-align:start;background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh);cursor:pointer}
.mem .av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:18px;margin-bottom:8px}
.mem b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem .bar{margin-top:8px}
.mem .tag2{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--t5);color:var(--t5i)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{border:0;text-align:left;background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center;cursor:pointer;color:var(--ink)}
.tool .ti{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.tool svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tool b{display:block;font-size:15px;line-height:1.25}.tool span.s{font-size:12.5px;color:var(--mute);line-height:1.3;display:block}
.tool.t1 .ti{background:var(--t1);color:var(--t1i)}.tool.t3 .ti{background:var(--t3);color:var(--t3i)}.tool.t4 .ti{background:var(--t4);color:var(--t4i)}.tool.t6 .ti{background:var(--t6);color:var(--t6i)}
.daily{display:block;width:100%;text-align:left;border:0;border-radius:18px;padding:16px;color:var(--ink);cursor:pointer;background:linear-gradient(135deg,var(--t3),var(--t1));box-shadow:var(--sh)}
.daily .k{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--t3i)}
.daily b{display:block;font-size:18px;margin:4px 0}
.daily span.s{font-size:14px;color:var(--mute);display:block}

/* ---------- Trang chủ kiểu minh họa (bản 2) ---------- */
:root{--navy:#15306b;--hero-a:#d5f5e6;--hero-b:#cdeefb;--cta-a:#dbeafe;--cta-b:#cfe9ff}
@media (prefers-color-scheme:dark){:root{--navy:#dbe7ff;--hero-a:#10372f;--hero-b:#10304a;--cta-a:#14284a;--cta-b:#12365a}}
body{background:radial-gradient(520px 320px at 100% 0,rgba(125,211,252,.35),transparent 70%),radial-gradient(480px 300px at 0 18%,rgba(110,231,183,.28),transparent 70%),linear-gradient(180deg,var(--g1) 0,var(--g2) 300px,var(--bg) 560px) no-repeat,var(--bg)}
.brand{position:relative;display:flex;align-items:center;gap:12px;padding:2px 0 14px;min-height:84px}
.brand .lg{width:54px;height:54px;flex:none}
.brand h1{margin:0;font-size:20px;font-weight:800;color:var(--navy);letter-spacing:-.01em;line-height:1.15}
.brand .tg{font-size:13px;color:var(--mute);margin-top:2px}
.brand .bt{min-width:0;flex:1;padding-right:100px}
.brand .deco{position:absolute;right:0;top:30px;width:80px;height:58px;pointer-events:none}
@media (max-width:370px){.brand .deco{display:none}.brand .bt{padding-right:52px}}
.brand .gearb{position:absolute;right:0;top:-2px;width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;color:var(--navy);cursor:pointer}
.brand .gearb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand .verb{border:0;background:none;color:var(--mute);font-size:12px;cursor:pointer;padding:0 0 0 6px;opacity:.8}
.tiles .tile{padding:12px 4px 12px;border-radius:20px;font-size:13.5px;color:var(--navy)}
.tile .art{width:52px;height:52px}
.hero2{position:relative;display:flex;gap:6px;align-items:stretch;border-radius:22px;padding:16px 8px 16px 16px;margin:0 0 6px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));box-shadow:var(--sh);border:1px solid rgba(255,255,255,.6);overflow:hidden}
.hero2 .tx{flex:1;min-width:0;z-index:1}
.hero2 h2{margin:0 0 4px;font-size:20px;color:var(--navy);display:flex;align-items:center;gap:6px}
.hero2 h2 svg{width:22px;height:22px;flex:none}
.hero2 p{margin:0 0 10px;font-size:14.5px;color:var(--mute);line-height:1.4}
.hero2 .bar{height:9px;background:rgba(255,255,255,.7);margin:0 0 12px;max-width:210px}
@media (prefers-color-scheme:dark){.hero2 .bar{background:rgba(255,255,255,.14)}}
.pill{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;min-height:44px;background:linear-gradient(135deg,#0f766e,#0e9aa7);color:#fff;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 6px 16px rgba(14,120,130,.32)}
.pill.navy{background:var(--navy);color:#fff;box-shadow:0 6px 16px rgba(21,48,107,.3)}
@media (prefers-color-scheme:dark){.pill.navy{background:#2563eb}}
.hero2 .doc{width:104px;flex:none;align-self:flex-end}
.pct{display:inline-block;font-weight:800;color:var(--pri);margin-left:6px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;border:0;border-radius:20px;padding:14px 12px 12px;background:var(--card);box-shadow:var(--sh);cursor:pointer;color:var(--ink);min-height:132px}
.dcard .art{width:58px;height:58px}
.dcard b{font-size:16px;color:var(--navy);line-height:1.2}
.dcard .s{font-size:12.5px;color:var(--mute);line-height:1.3;padding-right:30px}
.dcard .go{position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:50%;background:var(--t1);color:var(--t1i);display:grid;place-items:center;font-weight:800}
.cta{display:flex;align-items:center;gap:12px;border-radius:22px;padding:14px;margin-top:18px;background:linear-gradient(135deg,var(--cta-a),var(--cta-b));box-shadow:var(--sh)}
.cta .art{width:58px;height:66px;flex:none}
.cta b{display:block;font-size:16px;color:var(--navy);line-height:1.25}
.cta .s{font-size:13px;color:var(--mute);line-height:1.3;display:block;margin-top:2px}
.cta .pill{padding:10px 14px;font-size:14px;white-space:nowrap;margin-left:auto}
.sec h2{color:var(--navy)}
.sec h2 svg{width:22px;height:22px;vertical-align:-4px;margin-right:6px}

/* ---------- Trang chủ dùng hình minh họa thật (bản 3) ---------- */
.brand{margin:-16px -16px 16px;padding:calc(18px + env(safe-area-inset-top)) 16px 16px;border-radius:0 0 28px 28px;min-height:0;background:linear-gradient(95deg,#edf1fe 0%,#e0e9fd 45%,#c4daff 100%);box-shadow:0 8px 24px rgba(60,100,170,.12)}
.brand h1{color:#15306b;white-space:normal;font-size:20px}
.brand .tg{color:#5a6a8c}
.brand .verb{color:#5a6a8c}
.brand .bt{padding-right:112px}
.brand .lg{width:58px;height:auto;border-radius:16px;mix-blend-mode:multiply}
.brand .deco{position:absolute;right:0;top:30px;width:150px;height:auto;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 24%,#000 80%,transparent 100%),linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,#000 24%,#000 80%,transparent 100%),linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent 100%);mask-composite:intersect}
.brand .gearb{top:calc(14px + env(safe-area-inset-top));right:16px;color:#15306b;background:#fff}
@media (max-width:370px){.brand .deco{display:none}.brand .bt{padding-right:52px}}
.tile{background:linear-gradient(180deg,#f8f9ff,#eef2fd);color:#15306b}
.tile .art,.dcard .art,.cta .art{object-fit:contain;border-radius:16px;-webkit-mask-image:radial-gradient(closest-side,#000 86%,transparent 100%);mask-image:radial-gradient(closest-side,#000 86%,transparent 100%)}
.tile .art{width:60px;height:60px}
.dcard{background:linear-gradient(180deg,#f8f9ff,#eef2fd)}
.dcard .art{width:62px;height:62px}
.dcard b{color:#15306b}.dcard .s{color:#5a6a8c}
@media (prefers-color-scheme:dark){.tile,.dcard{background:var(--card);color:var(--ink)}.dcard b{color:var(--ink)}.dcard .s{color:var(--mute)}.tile .art,.dcard .art{background:#eef1fd;-webkit-mask-image:none;mask-image:none}}
.hero2{margin-top:26px;overflow:visible;min-height:172px;background:linear-gradient(120deg,#e5f6f6,#cdeee6)}
.hero2 .tx{max-width:60%}
.hero2 .doc{position:absolute;right:2px;bottom:0;width:39%;height:auto;max-height:118%;object-fit:contain;object-position:bottom right;pointer-events:none}
.hero2 h2{font-size:18px}
.hero2 h2{color:#15306b}.hero2 p{color:#4b5d78}
.hero2 .bar{background:rgba(255,255,255,.75)}
.cta{background:linear-gradient(95deg,#c8e8ff,#dbe6fd)}
.cta b{color:#15306b}.cta .s{color:#5a6a8c}
.cta .art{width:68px;height:auto;aspect-ratio:284/250}
.hscroll{scrollbar-width:none;-ms-overflow-style:none}.hscroll::-webkit-scrollbar{display:none}

/* ---------- hình nền trong suốt (bản 4) ---------- */
.tile .art,.dcard .art,.cta .art{-webkit-mask-image:none;mask-image:none;background:none;border-radius:0}
@media (prefers-color-scheme:dark){.tile .art,.dcard .art{background:none}}
.brand .lg{width:60px;height:auto;border-radius:0;mix-blend-mode:normal;filter:drop-shadow(0 4px 8px rgba(20,60,140,.25))}
.brand .deco{position:absolute;right:14px;top:36px;width:118px;height:60px;-webkit-mask-image:none;mask-image:none}
.brand .deco img{position:absolute;display:block;filter:drop-shadow(0 4px 6px rgba(20,60,140,.22))}
.brand .deco .d1{left:0;top:0;width:44px;height:auto}
.brand .deco .d2{right:0;top:-4px;width:52px;height:auto}
.brand .deco .d3{left:40px;bottom:-4px;width:26px;height:auto}
.brand .bt{padding-right:136px}
.tile .art{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(20,60,140,.18))}
.dcard .art{width:60px;height:60px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(20,60,140,.18))}
.cta .art{width:62px;height:auto;filter:drop-shadow(0 4px 6px rgba(20,60,140,.2))}
.tool .ti{background:none!important;width:48px;height:48px}

<header><div class="hd"><h1 id="ttl">Hôm nay</h1><span class="sub" id="sub"></span></div><button class="ver" id="appver" aria-label="Phiên bản app, bấm để mở Cài đặt" onclick="go('set')"></button><button class="gear" id="gear" aria-label="Cài đặt" onclick="go('set')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></header>

<script>
'use strict';
/* ---------- Lưu trữ: IndexedDB ---------- */
const DB='tpcn-v2',KEY='state';
const empty=()=>({v:2,members:[],products:[],plans:[],intakes:[],notes:[],diary:[],docs:[],frameworks:[],dismissed:[],shopping:[],settings:{ul:'efsa'}});
let S=empty();
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,2);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('img'))d.createObjectStore('img')};
  r.onsuccess=()=>{r.result.onversionchange=()=>r.result.close();res(r.result)};r.onerror=()=>rej(r.error)});
async function load(){try{const db=await idb();const d=await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(KEY);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)});S={...empty(),...(d||{})}}catch(e){alert('Không mở được bộ nhớ trình duyệt: '+e.message)}
  }
// Danh sách sản phẩm chung (không có thông tin cá nhân) lấy từ GitHub khi tủ còn trống
async function loadSharedProducts(){
  try{const r=await fetch('data/san-pham.json',{cache:'no-cache'});if(!r.ok)return;
    const d=await r.json();if(!d||!Array.isArray(d.products))return;
    mergeProducts(d.products.filter(p=>p&&typeof p.id==='string'&&/^prd-[a-z0-9-]{1,60}$/.test(p.id)&&typeof p.name==='string'&&Array.isArray(p.ingredients)));
    save();render()}catch(e){}}
let saveT;async function flush(){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(S,KEY);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){alert('Lưu thất bại: '+e.message)}}
function save(){clearTimeout(saveT);saveT=setTimeout(flush,50)}
addEventListener('pagehide',()=>{clearTimeout(saveT);flush()});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
/* Ảnh lưu riêng khỏi dữ liệu chính để mỗi lần lưu không phải ghi lại cả ảnh */
async function imgTx(mode,fn){const db=await idb();try{return await new Promise((res,rej)=>{const t=db.transaction('img',mode);const r=fn(t.objectStore('img'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})}finally{db.close()}}
const putImg=(id,u)=>imgTx('readwrite',s=>s.put(u,id));
const getImg=id=>imgTx('readonly',s=>s.get(id));
const delImg=id=>imgTx('readwrite',s=>s.delete(id)).catch(()=>{});
async function loadImgs(ids,sel){const box=$(sel);if(!box)return;box.textContent='';for(const id of ids||[]){const u=await getImg(id).catch(()=>null);if(u&&/^data:image\//.test(u)){const im=document.createElement('img');im.src=u;im.alt='Ảnh nhãn';im.onclick=()=>window.open(u);box.appendChild(im)}}}

/* ---------- Tiện ích ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}; // giờ địa phương, không phải UTC
const byId=(a,id)=>a.find(x=>x.id===id);
const pname=id=>byId(S.products,id)?.name||'(đã xoá)';
const mname=id=>byId(S.members,id)?.name||'(đã xoá)';
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const WD=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const fmtDay=()=>{const d=new Date();return WD[d.getDay()]+', '+d.getDate()+'/'+(d.getMonth()+1)};

/* ---------- Điều hướng ---------- */
const IC={today:'<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18M9 15.5l2 2 4-4"/>',shelf:'<path d="M10.5 20.5l-7-7a4.9 4.9 0 017-7l7 7a4.9 4.9 0 01-7 7z"/><path d="M8 8l8 8"/>',know:'<path d="M2.5 5h6a3.5 3.5 0 013.5 3.5V20a2.5 2.5 0 00-2.5-2.5h-7z"/><path d="M21.5 5h-6A3.5 3.5 0 0012 8.5V20a2.5 2.5 0 012.5-2.5h7z"/>',fam:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17.5 14.5a5 5 0 014 5"/>'};
const TABS=[['today','Hôm nay'],['shelf','Tủ thuốc'],['know','Thư viện'],['fam','Gia đình']];
let tab='today',sub=null,fMember='',draft=null;
/* Lịch sử điều hướng: mỗi lần đổi màn hình ghi một mục vào lịch sử trình duyệt,
   nên nút Back của điện thoại lùi đúng một cấp. Chỉ ở trang Hôm nay (mục đầu tiên) thì Back mới thoát app. */
let navLock=false;
const navKey=()=>[tab,sub,fMember,libF,libTopic,personTab].join('|');
function navSnap(){return {k:navKey(),d:(history.state&&history.state.d)||0,tab,sub,fMember,libF,libTopic,libQ,personTab}}
function nav(){if(navLock)return;try{const cur=history.state;if(cur&&cur.k===navKey())return;const n=navSnap();n.d=(cur&&cur.d||0)+1;history.pushState(n,'')}catch(e){}}
/* Nút "‹ Quay lại" trong app: lùi một mục lịch sử nếu có, không thì chạy việc dự phòng */
function goBack(fallback){if(history.state&&history.state.d>0)history.back();else fallback()}
const setPT=k=>{personTab=k;render();nav()};
addEventListener('popstate',e=>{const st=e.state;if(!st||!st.k)return;navLock=true;
  try{tab=st.tab;sub=st.sub;fMember=st.fMember;libF=st.libF;libTopic=st.libTopic;libQ=st.libQ||'';personTab=st.personTab;render();$('#view').scrollTop=0}finally{navLock=false}});
function go(t,s=null){tab=t;sub=s;render();$('#view').scrollTop=0;nav()}
/* Bấm tab ở thanh dưới: về đầu tab đó (Thư viện về trang chủ đề, Gia đình về danh sách), không giữ trang con đang mở */
function goTab(t){if(t==='know'){libF='all';libTopic='';libQ=''}if(t==='fam')personTab='tq';go(t)}
function render(){
  const cur=tab==='add'?'shelf':tab;
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===cur?'on':''}" ${k===cur?'aria-current="page"':''} onclick="goTab('${k}')"><img class="ni" src="img/n-${k}.webp" alt="">${l}</button>`).join('');
  $('#gear').classList.toggle('on',tab==='set');
  document.querySelector('header').style.display=tab==='today'?'none':'';

/* Xoá bộ nhớ đệm của app và tải lại. Dữ liệu bạn đã nhập (trong IndexedDB) KHÔNG bị xoá. */
async function forceUpdate(){
  try{if('serviceWorker' in navigator)for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();
    if(window.caches)for(const k of await caches.keys())await caches.delete(k)}catch(e){}
  location.reload();
}
async function checkUpdate(){
  try{const t=await (await fetch('sw.js?c='+Date.now(),{cache:'no-store'})).text();
    const m=t.match(/const VER='([^']+)'/);newVer=m&&m[1]!==APP_VER?m[1]:'';
    if(newVer)render();else if(tab==='set')render();return newVer||APP_VER}catch(e){return null}
}

/* ---------- Hộp thoại ---------- */
function dialog(title,fields,data,onSave){
  const d=$('#dlg');
  const f=fields.map(x=>{
    const v=data[x.k]??'',id='f_'+x.k;
    if(x.t==='area')return`<label>${x.l}<textarea id="${id}">${esc(v)}</textarea></label>`;
    if(x.t==='sel')return`<label>${x.l}<select id="${id}">${x.o.map(([val,lab])=>`<option value="${esc(val)}" ${val===v?'selected':''}>${esc(lab)}</option>`).join('')}</select></label>`;
    return`<label>${x.l}<input id="${id}" type="${x.t||'text'}" value="${esc(v)}"></label>`}).join('');
  d.innerHTML=`<form method="dialog"><b>${esc(title)}</b>${f}<div class="row"><button class="btn pri" value="ok">Lưu</button><button class="btn" value="x" formnovalidate>Huỷ</button></div></form>`;
  d.onclose=()=>{if(d.returnValue!=='ok')return;const o={...data};fields.forEach(x=>{const v=$('#f_'+x.k).value;o[x.k]=x.t==='number'?(v===''?'':Number(v)):v.trim()});onSave(o)};
  d.returnValue='';d.showModal();
}
const upsert=(arr,o)=>{const i=arr.findIndex(x=>x.id===o.id);i<0?arr.push(o):arr[i]=o;save();render()};
const remove=(arr,id,msg)=>{if(confirm(msg||'Xoá mục này?')){arr.splice(arr.findIndex(x=>x.id===id),1);save();render()}};

/* ---------- Hôm nay ---------- */
function slotsFor(day){
  const out=[];
  for(const p of S.plans){
    if(fMember&&p.memberId!==fMember)continue;
    if(p.start&&p.start>day)continue;if(p.end&&p.end<day)continue;
    if(!byId(S.members,p.memberId)||!byId(S.products,p.productId))continue;
    out.push({plan:p,intake:S.intakes.find(i=>i.planId===p.id&&i.date===day)});
  }
  return out.sort((a,b)=>(a.plan.time||'99').localeCompare(b.plan.time||'99'));
}
function setIntake(planId,status){
  const day=today();let i=S.intakes.find(x=>x.planId===planId&&x.date===day);
  if(i&&i.status===status){S.intakes.splice(S.intakes.indexOf(i),1)}
  else if(i){i.status=status;i.at=Date.now()}
  else S.intakes.push({id:uid(),planId,date:day,status,at:Date.now()});
  save();render();
}
const chipRow=()=>S.members.length?`<div class="chips"><button class="${!fMember?'on':''}" onclick="fMember='';render()">Cả nhà</button>${S.members.map(m=>`<button class="${m.id===fMember?'on':''}" onclick="fMember='${m.id}';render()">${esc(m.name)}</button>`).join('')}</div>`:'';

   Khi app đang mở, kiểm tra mỗi phút. Thông báo hệ thống chỉ hiện khi đã được cho phép. */
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
function dueNow(){const day=today(),n=nowMin();
  return slotsFor(day).filter(s=>{const t=mins(s.plan.time);return t!=null&&t<=n&&s.intake?.status!=='taken'&&s.intake?.status!=='skipped'})}
let lastPing='';
function checkReminders(){
  const due=dueNow();if(!due.length)return;
  const key=today()+'|'+due.map(s=>s.plan.id).join(',');
  if(key===lastPing)return;lastPing=key;
  if('Notification' in window&&Notification.permission==='granted'){
    try{new Notification('Đến giờ uống TPCN',{body:due.map(s=>mname(s.plan.memberId)+': '+pname(s.plan.productId)).join('\n'),tag:'tpcn-due'})}catch{}
  }
  if(tab==='today')render();
}
function askReminders(){
  if(!('Notification' in window)){alert('Trình duyệt này không hỗ trợ thông báo. Bạn vẫn thấy nhắc trong app khi mở.');return}
  Notification.requestPermission().then(p=>{alert(p==='granted'?'Đã bật thông báo. Khi app đang mở, sẽ có nhắc đúng giờ.':'Chưa bật được thông báo. Vẫn thấy nhắc trong app khi mở.');render()});
}

  const rows=[['Nhóm','Tên sản phẩm','Nơi bán','Giá một đơn vị (Kč)','Số lượng','Thành tiền (Kč)','Sẽ mua','Liều dùng','Trạng thái','Đường dẫn','Cần kiểm tra','Ghi chú']];
  for(const x of shopList())rows.push([x.group,x.name,x.shop,x.price,shopQtyOf(x),(Number(x.price)||0)*shopQtyOf(x),x.buy===false?'Không':'Có',x.dose,x.status,x.link,x.check||x.checkShort,x.notes].map(v=>v==null?'':String(v)));
  const q=v=>'"'+v.replace(/"/g,'""')+'"';

const SHOP_UNITS=[[120,'viên'],[200,'viên'],[1000,'giọt'],[300,'giọt'],[112,'viên'],[250,'ml'],[200,'viên'],[90,'viên'],[120,'viên']];
function shopSeedOnce(){
  S.settings=S.settings||{};
  if(!S.settings.shopSeeded){
    S.settings.shopSeeded=true;
    if(!shopList().length)S.shopping=SHOP_SEED.map((x,i)=>({id:'n'+(i+1),status:'Chưa mua',units:SHOP_UNITS[i][0],unitLabel:SHOP_UNITS[i][1],...x}));
    S.settings.shopV2=true;S.settings.shopV3=true;save();return}
  // Bản cũ đã nhập 9 mục trước khi có nhóm, số lượng và ô chọn: bổ sung phần còn thiếu, không đụng vào chỗ bạn đã sửa
  if(!S.settings.shopV2){
    S.settings.shopV2=true;
    shopList().forEach(x=>{const m=/^n(\d+)$/.test(x.id)?SHOP_SEED[Number(x.id.slice(1))-1]:null;if(!m)return;
      if(x.group==null)x.group=m.group;if(x.qty==null)x.qty=m.qty;if(x.buy==null)x.buy=m.buy;if(x.checkShort==null)x.checkShort=m.checkShort});
    save()}
  // Bản đã có từ v2-54 chưa có số viên/giọt/ml: bổ sung cho 9 mục gốc, không đụng vào mục bạn tự thêm
  if(!S.settings.shopV3){
    S.settings.shopV3=true;
    shopList().forEach(x=>{const m=/^n(\d+)$/.test(x.id)?SHOP_UNITS[Number(x.id.slice(1))-1]:null;if(!m)return;if(x.units==null)x.units=m[0];if(x.unitLabel==null)x.unitLabel=m[1]});
    save()}}
/* ---------- Sổ giá: lịch sử xem và mua, so sánh giá giữa các lần ---------- */
const shopLog=x=>x.log||[];
const shopBuys=x=>shopLog(x).filter(e=>e.kind==='mua').sort((a,b)=>String(a.date).localeCompare(String(b.date)));
const fmtD=d=>String(d||'').split('-').reverse().join('/');
const fmt2=n=>String(Math.round(n*100)/100);
const unitsOf=(x,e)=>{const u=Number(e&&e.units)>0?Number(e.units):Number(x.units);return u>0?u:null};
const unitPrice=(x,e)=>{const u=unitsOf(x,e);return u&&e.price!==''&&e.price!=null?Number(e.price)/u:null};
/* So giá lần cuối với lần liền trước (theo giá một đơn vị nếu biết số viên, không thì theo giá cả sản phẩm) */
function trendOf(x,list){
  if(list.length<2)return null;
  const a=list[list.length-2],b=list[list.length-1],ua=unitPrice(x,a),ub=unitPrice(x,b),both=ua!=null&&ub!=null;
  const pa=both?ua:Number(a.price),pb=both?ub:Number(b.price);
  if(!(pa>0)||!(pb>0))return null;
  const d=pb-pa;return {up:d>1e-9,down:d<-1e-9,pct:Math.round(d/pa*1000)/10,box:Number(b.price)-Number(a.price)}}
const trendHtml=t=>!t?'':(t.up?`<span class="tr up">▲ +${fmt2(t.pct)}%</span>`:t.down?`<span class="tr dn">▼ ${fmt2(Math.abs(t.pct))}%</span>`:`<span class="tr">= không đổi</span>`);
function shopLogSave(id,kind,v){
  const x=byId(shopList(),id);if(!x)return;
  if(v.price===''||v.price==null||!(Number(v.price)>=0)){alert('Hãy nhập giá.');return}
  const e={id:uid(),kind,date:v.date||today(),shop:v.shop||x.shop||'',price:Number(v.price),qty:Math.max(1,Number(v.qty)||1),units:Number(v.units)>0?Number(v.units):(Number(x.units)>0?Number(x.units):''),link:v.link||x.link||'',note:v.note||''};
  if(!(Number(x.units)>0)&&Number(v.units)>0)x.units=Number(v.units);
  if(kind==='mua'&&x.price!==''&&x.price!=null)e.planned=Number(x.price);
  x.log=[...shopLog(x),e];
  if(kind==='mua'){x.status='Đã mua';x.buy=true}
  save();render()}

function shopRebuy(id){const x=byId(shopList(),id);if(!x)return;
  x.status='Chưa mua';x.buy=true;const last=shopBuys(x).pop();if(last&&last.price!=null)x.price=last.price;save();render()}
function shopLogDel(id,eid){const x=byId(shopList(),id);if(!x)return;if(!confirm('Xoá dòng này khỏi lịch sử giá?'))return;x.log=shopLog(x).filter(e=>e.id!==eid);save();render()}
function shopEntry(x,e,prevSame){
  const up=unitPrice(x,e),t=prevSame?trendOf(x,[prevSame,e]):null;
  return `<div class="le"><div><b>${e.kind==='mua'?'Đã mua':'Đã xem'}</b> ${fmtD(e.date)}${e.shop?' · '+esc(e.shop):''}</div>
   <div>${fmt(e.price)} Kč${e.qty>1?` × ${e.qty}`:''}${up!=null?` <span class="mute">(${fmt2(up)} Kč/${esc(x.unitLabel||'đv')})</span>`:''} ${trendHtml(t)}</div>
   ${e.planned!=null&&e.kind==='mua'&&Number(e.planned)!==Number(e.price)?`<div class="mute">Dự kiến ${fmt(e.planned)} Kč, thực tế ${Number(e.price)>Number(e.planned)?'cao hơn':'thấp hơn'} ${fmt(Math.abs(Number(e.price)-Number(e.planned)))} Kč</div>`:''}
   ${e.note?`<div class="mute">${esc(e.note)}</div>`:''}
   <div class="lek">${safeUrl(e.link)?`<a href="${esc(e.link)}" target="_blank" rel="noopener noreferrer">mở trang</a>`:''}<button class="lx" onclick="shopLogDel('${x.id}','${e.id}')" aria-label="Xoá dòng">xoá</button></div></div>`}
function shopEntries(x,max){
  const all=[...shopLog(x)].sort((a,b)=>String(b.date).localeCompare(String(a.date))||0);
  const prevOf=e=>{const same=[...shopLog(x)].filter(z=>z.kind===e.kind&&String(z.date)<String(e.date)).sort((a,b)=>String(b.date).localeCompare(String(a.date)));return same[0]};
  return (max?all.slice(0,max):all).map(e=>shopEntry(x,e,prevOf(e))).join('')}
function shopHistory(){
  const L=shopList().filter(x=>shopLog(x).length);
  if(!L.length)return '<div class="empty">Chưa có lần mua hay lần xem nào. Mở một sản phẩm rồi bấm “Đã mua…” để ghi giá thật, nơi mua và link. Lần sau mua lại, app sẽ so giá với các lần trước.</div>';
  const buys=L.flatMap(x=>shopBuys(x).map(e=>({x,e}))),spent=buys.reduce((a,{e})=>a+(Number(e.price)||0)*(Number(e.qty)||1),0);
  const cards=L.map(x=>{const b=shopBuys(x),seenL=shopLog(x).filter(e=>e.kind==='xem').sort((p,q)=>String(p.date).localeCompare(String(q.date))),base=b.length?b:seenL,last=b[b.length-1],lastSeen=seenL[seenL.length-1],t=trendOf(x,base),allU=base.length>0&&base.every(e=>unitPrice(x,e)!=null),prices=base.map(e=>allU?unitPrice(x,e):Number(e.price)).filter(n=>n>0);
    const mn=prices.length?Math.min(...prices):null,av=prices.length?prices.reduce((a,n)=>a+n,0)/prices.length:null,lab=allU?' Kč/'+(x.unitLabel||'đv'):' Kč';
    return `<details class="card hc"><summary><span class="si"><b>${esc(x.name)}</b>
      <span class="mute">${last?`Mua gần nhất ${fmtD(last.date)} · ${esc(last.shop||'')} · ${fmt(last.price)} Kč`:`Chưa mua · đã xem ${seenL.length} lần, gần nhất ${fmtD(lastSeen.date)} · ${fmt(lastSeen.price)} Kč`}</span>
      ${base.length>1?`<span class="mute">${base.length} lần ${b.length?'mua':'xem'} · thấp nhất ${fmt2(mn)}${lab} · trung bình ${fmt2(av)}${lab}</span>`:''}</span><span class="sp">${trendHtml(t)}</span></summary>
      <div class="sd">${shopEntries(x)}<div class="row" style="margin-top:6px"><button class="btn sm" onclick="shopRebuy('${x.id}');shopMode('group')">Mua lại</button><button class="btn sm" onclick="shopSeenDialog('${x.id}')">Ghi giá đã xem</button></div></div></details>`}).join('');
  return `<div class="card shsum" style="grid-template-columns:repeat(3,1fr)"><div><b>${buys.length}</b><span class="mute">lần mua đã ghi</span></div><div><b>${fmt(spent)} Kč</b><span class="mute">tổng đã chi</span></div><div><b>${L.length}</b><span class="mute">sản phẩm có lịch sử</span></div></div>
   ${cards}<div class="row" style="margin-top:8px"><button class="btn sm" onclick="shopHistCsv()">Xuất lịch sử (CSV)</button></div>
   <div class="mute" style="font-size:12px;margin-top:6px">Mũi tên so với lần liền trước. App so theo giá mỗi viên (hoặc ml, giọt) khi cả hai lần đều biết số viên trong hộp; nếu có lần thiếu, app so theo giá cả hộp để không lẫn đơn vị. App chưa tính giá trên mỗi mg hoạt chất, vì nhãn ghi hàm lượng theo liều (một liều có thể là 2 viên) nên tính tự động dễ sai.</div>`}
function shopHistCsv(){
  const rows=[['Sản phẩm','Loại','Ngày','Nơi','Giá một sản phẩm (Kč)','Số lượng','Thành tiền (Kč)','Giá một đơn vị (Kč)','Đường dẫn','Ghi chú']];

function ingRow(i){
  const key=nutrKey(i),sk=substKeyOf(i),cn=canonName(i,sk),has=kbKeyOf({name:cn,key:sk});
  const nm=has?`<a href="#" data-n="${esc(cn)}" onclick="go('know',this.dataset.n);return false">${esc(i.name)}</a>`:`${esc(i.name)} <span class="mute" style="font-size:11px">(chưa có bài)</span>`;
  let bar='';const L=key?limitOf(key,null):null,v=key?toUnit(i.amount,i.unit,NUTR[key].u,key):null;
  if(L&&v!=null&&counts(i,key)){const ul=L.amideUl!=null&&isAmide(i)?L.amideUl:L.ul,pc=v/ul*100;
    bar=`<div class="mute" style="font-size:11px">${Math.round(pc)}% ${L.safe?'mức an toàn':'mức tối đa'} ${L.by} (${fmt(ul)} ${L.u})</div><div class="bar"><i style="width:${Math.min(100,pc)}%;background:${pc>100?'var(--bad)':pc>=80?'var(--warn)':'var(--pri)'}"></i></div>`}
  return`<tr><td>${nm}${bar}</td><td>${esc(i.amount)} ${esc(i.unit)}</td><td>${esc(i.form)}</td></tr>`}

/* ---------- Nhập từ ảnh / link / chữ ---------- */
let stage={title:'',source:'',text:'',images:[]},addMsg='';
const blank=()=>({id:uid(),name:'',brand:'',form:'',dosageLabel:'',price:'',store:'',url:'',warnings:'',notes:'',other:'',cert:'',units:'',unitLabel:'',shopId:'',text:'',imageIds:[],ingredients:[{name:'',amount:'',unit:'mg',form:''}]});
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('Không đọc được ảnh'));im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};im.src=r.result};r.readAsDataURL(file)})}
function loadScript(src){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Không tải được thư viện đọc chữ (cần internet lần đầu)'));document.head.appendChild(s)})}
async function ocr(urls,log){
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  const w=await Tesseract.createWorker('eng+ces+vie',1,{logger:m=>{if(m.status==='recognizing text')log('Đang đọc chữ… '+Math.round(m.progress*100)+'%')}});
  let out='';try{for(const [i,u] of urls.entries()){log(`Ảnh ${i+1}/${urls.length}…`);const r=await w.recognize(u);out+=(out?'\n\n':'')+r.data.text.trim()}}finally{await w.terminate()}return out}
/* Xử lý ảnh trước khi đọc chữ: phóng to, chuyển xám, kéo giãn độ tương phản.
   Cách "flat" còn chia cho nền đã làm mờ để khử bóng đổ. Thử cả hai, giữ kết quả tách được nhiều hoạt chất hơn. */
const loadImg=u=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>j(new Error('Không đọc được ảnh'));i.src=u});
async function prepImage(url,flat){
  const im=await loadImg(url),k=Math.max(1,Math.min(2.5,1800/Math.max(im.width,im.height))),W=Math.round(im.width*k),H=Math.round(im.height*k);
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(im,0,0,W,H);
  let B=null;
  if(flat){const sm=document.createElement('canvas');sm.width=Math.max(8,W>>4);sm.height=Math.max(8,H>>4);sm.getContext('2d').drawImage(c,0,0,sm.width,sm.height);
    const bg=document.createElement('canvas');bg.width=W;bg.height=H;const bx=bg.getContext('2d');bx.filter='blur(6px)';bx.drawImage(sm,0,0,W,H);B=bx.getImageData(0,0,W,H).data}
  const d=x.getImageData(0,0,W,H),p=d.data,n=W*H,g=new Uint8Array(n),h=new Uint32Array(256);
  for(let i=0;i<n;i++){let v=p[4*i]*.299+p[4*i+1]*.587+p[4*i+2]*.114;
    if(B)v=Math.min(255,v/Math.max(1,B[4*i]*.299+B[4*i+1]*.587+B[4*i+2]*.114)*235);
    v|=0;g[i]=v;h[v]++}
  const cut=n*(flat?.02:.01);let lo=0,hi=255,a=0;while(lo<255&&(a+=h[lo])<cut)lo++;a=0;while(hi>0&&(a+=h[hi])<cut)hi--;
  const s=hi>lo?255/(hi-lo):1;
  for(let i=0;i<n;i++)p[4*i]=p[4*i+1]=p[4*i+2]=Math.max(0,Math.min(255,(g[i]-lo)*s));
  x.putImageData(d,0,0);return c.toDataURL('image/png')}
async function ocrBest(urls,log){
  const outs=[];
  for(const [i,u] of urls.entries()){
    log(`Ảnh ${i+1}/${urls.length}: xử lý ảnh…`);
    const cands=[];let err=null;

/* Tách thành phần từ chữ trên nhãn. Chỉ gợi ý: người dùng luôn phải soát lại. */
const UNIT_MAP={mg:'mg',mcg:'mcg','µg':'mcg','μg':'mcg',ug:'mcg',g:'g',iu:'IU',ml:'ml',cfu:'CFU'};
const ING_RE=/^(.*?)[\s:.\-–]*((?=[0-9OolI.,]*\d)[0-9OolI]+(?:[.,][0-9OolI]+)?)\s*(mg|mcg|µg|μg|ug|g|iu|ml|cfu)\b(.*)$/i;
const HEAD={other:/^(other ingredients?|ostatní složky|další složky|thành phần khác)\s*[:.\-]?\s*/i,warn:/^(warnings?|caution|upozornění|cảnh báo)\s*[:.\-]?\s*/i,dir:/^(suggested use|directions?|dosage|doporučené dávkování|dávkování|použití|cách dùng|liều dùng)\s*[:.\-]?\s*/i,serv:/^(serving size|velikost porce|khẩu phần)\s*[:.\-]?\s*/i};
function parseFacts(raw){
  const out={ingredients:[],other:'',warnings:'',directions:'',serving:''};
  const sec={other:'other',warn:'warnings',dir:'directions'};
  let cur=null;
  for(const l of raw.replace(/ /g,' ').split(/\r?\n/).map(s=>s.trim())){
    if(!l){cur=null;continue}
    let hit=false;
    for(const k of ['serv','other','warn','dir']){const m=l.match(HEAD[k]);if(m){hit=true;const rest=l.slice(m[0].length);
      if(k==='serv'){out.serving=rest;cur=null}else{cur=sec[k];out[cur]+=(out[cur]?' ':'')+rest}break}}
    if(hit)continue;
    if(cur){out[cur]+=(out[cur]?' ':'')+l;continue}
    const m=ING_RE.exec(l);if(!m)continue;
    let name=m[1].replace(/[\s:.\-–,*]+$/,'').trim(),form='';
    const pm=name.match(/\(([^)]*)\)/);if(pm){form=pm[1].replace(/^(as|from|z|ve formě)\s+/i,'').trim();name=name.replace(pm[0],'').replace(/\s+/g,' ').trim()}
    if(!name||/serving|daily value|calor|%\s*dv/i.test(name))continue;
    const rawNum=m[2];let check=/[OolI]/.test(rawNum);
    let amount=Number(rawNum.replace(/[Oo]/g,'0').replace(/[lI]/g,'1').replace(',','.'));
    if(Number.isNaN(amount)){amount='';check=true}
    out.ingredients.push({name,amount,unit:UNIT_MAP[m[3].toLowerCase()]||'mg',form,check});
  }
  return out;
}

/* ---------- Tự đối chiếu với kho NIH, tên, giá ---------- */
function cleanTitle(t){
  let s=String(t||'').split(/\s[|–—]\s|\s-\s/)[0];
  s=s.replace(/,?\s*\b\d+\s*(?:capsules?|caps|tablets?|softgels?|veggie\s*caps?|vcaps?|count|ct|pcs|viên|tobolek|kapslí|tablet)\b.*$/i,'');
  return s.replace(/\s+/g,' ').replace(/[,\s]+$/,'').trim().slice(0,100)}
function findPrice(t){
  let m=String(t||'').match(/(\d{1,3}(?:[ . ]\d{3})*|\d+)(?:[.,]\d{1,2})?\s*(?:Kč|CZK)/i);
  if(m){const num=Number(m[0].replace(/\s*(Kč|CZK)/i,'').replace(/[ . ](?=\d{3}\b)/g,'').replace(',','.'));if(num>0&&num<100000)return{czk:num,text:m[0].trim()}}
  m=String(t||'').match(/(?:\$|€|£)\s?\d+(?:[.,]\d{2})?|\d+(?:[.,]\d{2})?\s?(?:€|EUR|USD)/i);
  return m?{czk:null,text:m[0].trim()}:null}
const ingKey=g=>nutrKey(g)||norm(g.name).replace(/[^a-z0-9à-ỹ]+/g,' ').trim();
function compareIngs(photo,nih){
  const idx=new Map();for(const g of nih){const k=ingKey(g);if(k&&!idx.has(k))idx.set(k,g)}
  let ok=0,matched=0;const diffs=[],marks=[],seen=new Set();
  for(const g of photo){const k=ingKey(g),o=idx.get(k);
    if(!o){diffs.push(`${g.name}: có trong ảnh nhưng không có trong NIH`);continue}
    seen.add(k);matched++;
    const nk=nutrKey(g),a=nk?toUnit(g.amount,g.unit,o.unit,nk):(g.unit===o.unit?Number(g.amount):null),b=Number(o.amount);
    if(a==null||!b){ok+=.5;continue}
    if(Math.abs(a-b)/b<=0.03)ok++;else{diffs.push(`${g.name}: ảnh ${g.amount} ${g.unit}, NIH ${o.amount} ${o.unit}`);marks.push(g)}}
  return{score:photo.length?ok/photo.length:0,matched,diffs,marks,onlyNih:[...idx.keys()].filter(k=>!seen.has(k)).length}}
function nihQueries(stg){
  const qs=[],t=cleanTitle(stg.title);if(t)qs.push(t.replace(/,/g,' '));
  const lines=String(stg.text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const stop=lines.findIndex(l=>/supplement facts|amount per serving|serving size|nutrition facts|údaje o výživě/i.test(l));
  const head=(stop<0?lines.slice(0,4):lines.slice(0,stop)).filter(l=>l.length>=4&&l.length<=60&&(l.match(/[A-Za-zÀ-ỹ]/g)||[]).length/l.length>.7).slice(0,3);
  if(head.length)qs.push(head.join(' '));
  return [...new Set(qs)]}
async function nihMatch(d,stg){
  const photo=d.ingredients.filter(g=>g.name&&g.amount!=='');
  if(photo.length<2)return null;
  const st=m=>{const e=$('#st');if(e)e.textContent=m};
  const run=async()=>{
    st('Đối chiếu với kho NIH…');let best=null;
    for(const q of nihQueries(stg)){
      const hits=(await dsldSearch(q)).sort((a,b)=>(a.off?1:0)-(b.off?1:0)).slice(0,4);
      for(const h of hits){const cand=await dsldDraft(h.id),cmp=compareIngs(photo,cand.ingredients);
        if(!best||cmp.score>best.cmp.score)best={h,cand,cmp}}
      if(best&&best.cmp.score>=.8)break}
    if(!best||best.cmp.score<.5||best.cmp.matched<2)return null;
    best.cmp.marks.forEach(g=>g.check=true);
    const c=best.cand;
    return{id:best.h.id,name:c.name,brand:c.brand,score:best.cmp.score,diffs:best.cmp.diffs.slice(0,8),onlyNih:best.cmp.onlyNih,
      draft:{ingredients:c.ingredients,dosageLabel:c.dosageLabel,warnings:c.warnings,notes:c.notes,form:c.form,url:c.url}}};
  try{return await Promise.race([run(),new Promise(r=>setTimeout(()=>r(null),15000))])}catch{return null}}

/* ---------- Kho NIH DSLD: nhãn thực phẩm chức năng Mỹ ---------- */
const DSLD='https://api.ods.od.nih.gov/dsld/v9/';
async function dsldSearch(q){
  const r=await fetch(DSLD+'search-filter?size=8&q='+encodeURIComponent(q));if(!r.ok)throw new Error('NIH trả lỗi '+r.status);
  const d=await r.json();return (d.hits||[]).map(h=>({id:h._id,brand:h._source.brandName||'',name:h._source.fullName||'',off:h._source.offMarket,form:h._source.physicalState?.langualCodeDescription||'',date:h._source.entryDate||''}))}
const DUNIT={mg:'mg',mcg:'mcg','mcg rae':'mcg','mcg dfe':'mcg','mg ne':'mg','mg ate':'mg','mg at':'mg','mcg re':'mcg',g:'g',gram:'g',iu:'IU',ml:'ml',cfu:'CFU','billion cfu':'CFU'};
async function dsldDraft(id){
  const r=await fetch(DSLD+'label/'+id);if(!r.ok)throw new Error('NIH trả lỗi '+r.status);
  const L=await r.json(),d=blank();
  d.name=L.fullName||'';d.brand=L.brandName||'';d.form=L.physicalState?.langualCodeDescription||'';d.url='https://dsld.od.nih.gov/label/'+L.id;
  const rows=[];
  for(const row of L.ingredientRows||[]){rows.push(row);for(const n of row.nestedRows||[])rows.push(n)}
  d.ingredients=rows.map(row=>{
    const q=(row.quantity||[])[0],uraw=(q?.unit||'').trim(),ul=uraw.toLowerCase(),u=DUNIT[ul];
    let amount=q&&typeof q.quantity==='number'&&q.quantity>0?q.quantity:'';
    if(amount!==''&&/billion/.test(ul))amount*=1e9;
    const forms=(row.forms||[]).map(f=>f.name).filter(Boolean).join(', ');
    const qual=uraw&&u&&uraw.toLowerCase()!==u.toLowerCase()?' ('+uraw+')':'';
    return{name:row.name||row.ingredientGroup||'',amount:u?amount:'',unit:u||'mg',form:(forms+qual).trim(),check:amount===''||!u};
  }).filter(g=>g.name);
  if(!d.ingredients.length)d.ingredients=[{name:'',amount:'',unit:'mg',form:''}];
  const ss=(L.servingSizes||[])[0],dir=(L.statements||[]).find(s=>/Directions/i.test(s.type));
  const rng=(a,b)=>a&&b&&a!==b?a+'–'+b:(a||b||'');
  d.dosageLabel=[ss?`1 liều nhãn = ${rng(ss.minQuantity,ss.maxQuantity)} ${ss.unit}${ss.minDailyServings||ss.maxDailyServings?`, ${rng(ss.minDailyServings,ss.maxDailyServings)} lần/ngày`:''}`:'',dir?.notes||''].filter(Boolean).join('. ');
  d.warnings=(L.statements||[]).filter(s=>/^Precaution/i.test(s.type)).map(s=>s.notes).filter(Boolean).join('\n');
  const oi=L.otheringredients,oit=typeof oi==='string'?oi:(oi?.text||'');
  d.other=oit?String(oit).trim():'';d.notes=`Nguồn: NIH DSLD #${L.id}, nhãn Mỹ nhập ${L.entryDate||'?'}.`;
  d.nihId=L.id;
  return d;
}
async function createFromDsld(id){
  const d=await dsldDraft(id);
  addMsg='Dữ liệu từ nhãn Mỹ của NIH, có thể khác bản bán ở Séc hoặc Việt Nam. Đối chiếu với nhãn trên hộp.';

/* ---------- Kho hoạt chất ---------- */
const norm=s=>String(s||'').toLowerCase().trim();
const substProducts=s=>S.products.filter(p=>(p.ingredients||[]).some(g=>s.key?substKeyOf(g)===s.key:norm(g.name)===norm(s.name)));
function substList(){
  const m=new Map();
  for(const k in NUTR)m.set(norm(NUTR[k].n),{name:NUTR[k].n,key:k});
  for(const p of S.products)for(const g of p.ingredients||[]){if(nutrKey(g))continue;const ak=aliasKey(g.name);if(ak&&(window.KB||{})[ak]){const kn=window.KB[ak].name;if(!m.has(norm(kn)))m.set(norm(kn),{name:kn,key:ak});continue}const n=norm(g.name);if(n&&!m.has(n))m.set(n,{name:g.name,key:null})}
  for(const n of S.notes){const s=(n.substance||'').trim();if(s&&!m.has(norm(s)))m.set(norm(s),{name:s,key:null})}
  for(const k of Object.values(window.KB||{}))if(!m.has(norm(k.name)))m.set(norm(k.name),{name:k.name,key:null})
  return [...m.values()].map(s=>({...s,count:substProducts(s).length})).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name,'vi'));
}
/* Danh mục hoạt chất: nhóm theo loại (KB_CATS trong kb.js), có ô tìm kiếm, mục "Có trong tủ" lên đầu */
let substQ='';
const kbKeyOf=s=>{const K=window.KB||{};return (s.key&&K[s.key])?s.key:Object.keys(K).find(k=>norm(K[k].name)===norm(s.name))};
const catNameOf=s=>{const k=kbKeyOf(s);const c=(window.KB_CATS||[]).find(c=>k&&c.keys.includes(k));return c?c.n:'Khác (chưa có bài)'};
const chipOf=s=>`<button class="${s.count?'on':''}" data-n="${esc(s.name)}" onclick="go('know',this.dataset.n)">${esc(s.name)}${s.count?' · '+s.count:''}</button>`;
function substGrid(){
  const q=norm(substQ),all=substList();
  const match=s=>!q||norm(s.name+' '+((kbOf(s)||{}).aka||'')).includes(q);
  const list=all.filter(match),mine=list.filter(s=>s.count>0);
  const order=[...(window.KB_CATS||[]).map(c=>c.n),'Khác (chưa có bài)'];
  const groups=order.map(n=>[n,list.filter(s=>catNameOf(s)===n)]).filter(([,l])=>l.length);
  return `<div class="card"><b>Hoạt chất</b><div class="mute">${Object.keys(window.KB||{}).length} chất có bài đầy đủ, xếp theo nhóm. Bấm một nhóm để mở, hoặc gõ tên để tìm.</div>
   <input id="substQ" placeholder="Tìm hoạt chất…" value="${esc(substQ)}" oninput="substQ=this.value;vKnow();const i=document.getElementById('substQ');i.focus();i.setSelectionRange(99,99)" style="margin:8px 0">
   ${mine.length?`<div style="margin-bottom:8px"><b style="font-size:14px">Có trong tủ của bạn</b><div class="chips" style="flex-wrap:wrap;overflow:visible;margin-top:6px">${mine.map(chipOf).join('')}</div></div>`:''}
   ${groups.map(([n,l])=>`<details ${q?'open':''} style="margin-top:6px"><summary style="cursor:pointer"><b style="font-size:14px">${esc(n)}</b> <span class="mute">(${l.length})</span></summary>${catChips(l)}</details>`).join('')||'<div class="mute" style="margin-top:6px">Không tìm thấy.</div>'}</div>`;
}
/* Bài kiến thức chung của một chất (dữ liệu trong kb.js) */
const KB_LV={chac:['Chắc chắn','#0f766e'],cothe:['Có thể','#1d4ed8'],chuaro:['Chưa rõ','#6b7280'],khong:['Không có tác dụng','#9a3412']};
const kbOf=s=>{const K=window.KB||{};return (s.key&&K[s.key])||Object.values(K).find(x=>norm(x.name)===norm(s.name))||null};
function kbHtml(s){
  const k=kbOf(s);if(!k)return '';
  const sec=(t,body,open)=>`<details class="card" ${open?'open':''}><summary style="cursor:pointer"><b>${t}</b></summary><div style="margin-top:8px">${body}</div></details>`;
  const ul=a=>`<ul style="margin:0;padding-left:18px">${(a||[]).map(x=>`<li style="margin-bottom:6px">${esc(x)}</li>`).join('')}</ul>`;
  return `<div class="mute" style="margin:0 0 8px">Bài kiến thức · cập nhật ${esc(k.updated)}${k.aka?' · còn gọi: '+esc(k.aka):''}</div>`+
    sec('Là gì',`<div>${esc(k.what)}</div>`,true)+
    sec('Tác dụng theo mức bằng chứng',k.benefits.map(([lv,t,src])=>{const L=KB_LV[lv]||KB_LV.chuaro;return`<div style="margin-bottom:10px"><span class="tag" style="background:none;border:1px solid ${L[1]};color:${L[1]}">${L[0]}</span> ${esc(t)} <span class="mute">(${esc(src)})</span></div>`}).join(''),true)+
    sec('Cần bao nhiêu mỗi ngày',`<div>${esc(k.need)}</div>`)+
    sec('Uống thế nào cho đúng',ul(k.how))+
    sec('Dạng nào tốt',`<div>${esc(k.forms)}</div>`)+
    sec('Ai cần thận trọng',ul(k.cautions))+
    sec('Tương tác với thuốc',ul(k.interactions))+
    sec('Có trong thực phẩm',`<div>${esc(k.foods)}</div>`)+
    sec('Nguồn',k.sources.map(([n,u])=>u?`<div><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(n)}</a></div>`:`<div class="mute">${esc(n)}</div>`).join('')+'<div class="mute" style="margin-top:6px">Nội dung được tóm tắt lại bằng lời của app, không thay lời khuyên của bác sĩ hay dược sĩ.</div>');
}
function vSubstance(name){
  const s=substList().find(x=>x.name===name);if(!s){sub=null;return vKnow()}
  const N=s.key?NUTR[s.key]:null,prods=substProducts(s),notes=S.notes.filter(n=>norm(n.substance)===norm(name));
  view(s.name,N?'Có trong bảng cảnh báo của app':'Chưa có mức tối đa trong app',
   `<div class="row" style="margin:0 0 10px"><button class="btn" onclick="goBack(()=>{go('know')})">‹ Thư viện</button></div>${kbHtml(s)}${famBlock(s)?`<div class="card">${famBlock(s).replace('<details class="fam">','<details class="fam" open>')}</div>`:''}
   ${N?(()=>{const E=EF[s.key];return`<div class="card"><b>Mức tối đa cho người lớn mỗi ngày</b>
     <div>EFSA (châu Âu): ${E?fmt(E.ul)+' '+N.u+(E.safe?' (mức an toàn, không phải UL chính thức)':'')+(E.amideUl?`; nicotinamide ${fmt(E.amideUl)} mg`:'')+` · <a href="${esc(E.url||EFSA_SUM)}" target="_blank" rel="noopener noreferrer">nguồn</a>`:'chưa đặt'}</div>
     <div>NIH (Mỹ): ${N.ul?fmt(N.ul)+' '+N.u+(N.ul51?`, từ 51 tuổi ${fmt(N.ul51)} ${N.u}`:''):'chưa đặt'} · <a href="${esc(nUrl(N))}" target="_blank" rel="noopener noreferrer">nguồn</a></div>
     ${E?.note?`<div class="mute">EFSA: ${esc(E.note)}</div>`:''}${N.note?`<div class="mute">NIH: ${esc(N.note)}</div>`:''}
     <div class="mute">App đang dùng chuẩn ${ulStd()==='efsa'?'EFSA':'NIH'} (đổi ở Cài đặt, nút bánh răng).</div></div>`})()
     :`<div class="note">App chưa có mức tối đa cho chất này. Bạn có thể thêm ghi chú kèm nguồn bên dưới.</div>`}
   <div class="card"><b>Sản phẩm trong tủ có chất này (${prods.length})</b>${prods.map(p=>{const g=(p.ingredients||[]).find(x=>s.key?substKeyOf(x)===s.key:norm(x.name)===norm(s.name));
     const who=[...new Set(S.plans.filter(x=>x.productId===p.id&&(!x.end||x.end>=today())).map(x=>mname(x.memberId)))];
     return`<div style="margin-top:6px;cursor:pointer" onclick="go('shelf','${p.id}')"><b>${esc(p.name)}</b> <span class="mute">${esc(g?.amount??'')} ${esc(g?.unit||'')}${g?.form?' · '+esc(g.form):''}${who.length?' · đang uống: '+esc(who.join(', ')):''}</span></div>`}).join('')||'<div class="mute">Chưa có.</div>'}</div>
   <div class="card"><b>Ghi chú của bạn (${notes.length})</b>${notes.map(n=>`<div style="margin-top:8px"><b>${esc(n.title)}</b>${noteTags(n)}${noteBody(n)}<div class="mute">${safeUrl(n.source)?`<a href="${esc(n.source)}" target="_blank" rel="noopener noreferrer">nguồn</a>`:esc(n.source||'')}</div>
     <div class="row"><button class="btn sm" onclick="editNote('${n.id}')">Sửa</button><button class="btn sm del" onclick="remove(S.notes,'${n.id}')">Xoá</button></div></div>`).join('')||'<div class="mute">Chưa có.</div>'}
    <div class="row"><button class="btn pri sm" data-n="${esc(s.name)}" onclick="editNote(null,{substance:this.dataset.n})">+ Thêm ghi chú về chất này</button></div></div>`);
}

/* ---------- Kiến thức ---------- */
let knowQ='';
const noteList=()=>S.notes.filter(n=>!knowQ||(n.title+' '+n.substance+' '+n.kind+' '+n.content).toLowerCase().includes(knowQ));
const noteTags=n=>(n.kind?`<span class="tag">${esc(n.kind)}</span>`:'')+(n.raw?'<span class="tag" style="background:none;color:var(--warn);border:1px solid var(--warn)">chưa rà</span>':'')+(String(n.id).startsWith('obs-')?'<span class="tag" style="background:none;color:var(--mute);border:1px solid var(--line)">từ Obsidian</span>':'');
const noteBody=n=>{const c=String(n.content||'');return c.length>360?`<details><summary class="mute" style="cursor:pointer">${esc(c.slice(0,200).replace(/\s+/g,' '))}… (xem đầy đủ)</summary><div class="mute" style="white-space:pre-wrap;margin-top:6px">${esc(c)}</div></details>`:`<div class="mute" style="white-space:pre-wrap">${esc(c)}</div>`};
/* Nhập file kiến thức do công cụ xuất từ kho Obsidian. Chỉ nhận id bắt đầu bằng "obs-" nên không ghi đè ghi chú tự viết. */
async function importKnowledge(f){
  if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(!d||d.kind!=='tpcn-knowledge'||d.v!==1||!Array.isArray(d.notes))throw new Error('Không đúng định dạng file kiến thức');
    const ok=d.notes.filter(n=>n&&typeof n.id==='string'&&/^obs-[a-z0-9-]{1,80}$/.test(n.id)&&typeof n.title==='string'&&typeof n.content==='string'&&n.content.length<200000);
    if(!ok.length)throw new Error('Không có ghi chú hợp lệ trong file');
    const upd=ok.filter(n=>byId(S.notes,n.id)).length;
    if(!confirm(`Nhập ${ok.length} ghi chú (${upd} ghi chú cũ từ Obsidian sẽ được cập nhật, ghi chú bạn tự viết giữ nguyên). Tiếp tục?`))return;
    const s=x=>String(x??'').slice(0,300);
    for(const n of ok){const o={id:n.id,title:s(n.title),kind:s(n.kind),substance:s(n.substance),source:s(n.source),content:n.content,added:s(n.added),raw:!!n.raw};
      const i=S.notes.findIndex(x=>x.id===o.id);i<0?S.notes.push(o):S.notes[i]=o}
    save();render();alert(`Đã nhập ${ok.length} ghi chú.`);
  }catch(e){alert('Lỗi: '+e.message)}
}
async function importProducts(f){
  if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(!d||d.kind!=='tpcn-products'||d.v!==1||!Array.isArray(d.products))throw new Error('Không đúng định dạng file sản phẩm');
    const ok=d.products.filter(p=>p&&typeof p.id==='string'&&/^prd-[a-z0-9-]{1,60}$/.test(p.id)&&typeof p.name==='string'&&Array.isArray(p.ingredients));
    if(!ok.length)throw new Error('Không có sản phẩm hợp lệ trong file');
    const upd=ok.filter(p=>byId(S.products,p.id)).length;
    if(!confirm(`Nhập ${ok.length} sản phẩm (${upd} sản phẩm đã có sẽ được cập nhật thành phần, lịch uống giữ nguyên). Tiếp tục?`))return;
    mergeProducts(ok);
    save();render();alert(`Đã nhập ${ok.length} sản phẩm.`);
  }catch(e){alert('Lỗi: '+e.message)}
}
const cleanStr=(x,n=300)=>String(x??'').slice(0,n);
function mergeProducts(ok){
  const s=cleanStr,U=['mg','mcg','g','IU','ml','CFU'];
  for(const p of ok){const old=byId(S.products,p.id)||{};
    const o={...blank(),...old,id:p.id,name:s(p.name),brand:s(p.brand),form:s(p.form),dosageLabel:s(p.dosageLabel),url:safeUrl(p.url).slice(0,500),thumb:/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(p.thumb||'')&&p.thumb.length<60000?p.thumb:(old.thumb||''),notes:s(p.notes,1000),
      warnings:s(p.warnings!=null?p.warnings:old.warnings,1000),other:s(p.other!=null?p.other:old.other,1500),cert:s(p.cert!=null?p.cert:old.cert,600),
      units:typeof p.units==='number'&&p.units>0?p.units:(old.units||''),unitLabel:s(p.unitLabel!=null?p.unitLabel:old.unitLabel,12),store:s(p.store!=null?p.store:old.store,60),
      price:typeof p.price==='number'&&p.price>=0?p.price:(old.price??''),
      ingredients:p.ingredients.slice(0,80).filter(g=>g&&typeof g.name==='string').map(g=>({name:s(g.name),amount:typeof g.amount==='number'&&g.amount>=0?g.amount:'',unit:U.includes(g.unit)?g.unit:'mg',form:s(g.form)}))};
    const i=S.products.findIndex(x=>x.id===o.id);i<0?S.products.push(o):S.products[i]=o}}
// Hồ sơ sức khỏe: chỉ giữ chuỗi, số, mảng và đối tượng lồng nhau, cắt độ dài, bỏ mọi thứ khác
function cleanDeep(v,depth=0){
  if(typeof v==='string')return v.slice(0,900);
  if(typeof v==='number'||typeof v==='boolean')return v;
  if(depth>4)return '';
  if(Array.isArray(v))return v.slice(0,80).map(x=>cleanDeep(x,depth+1));
  if(v&&typeof v==='object'){const o={};for(const k of Object.keys(v).slice(0,40))if(/^[a-zA-Z]{1,24}$/.test(k))o[k]=cleanDeep(v[k],depth+1);return o}
  return ''}
async function importProfile(f){
  if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(!d||d.kind!=='tpcn-profile'||d.v!==1||!d.member||typeof d.member.name!=='string')throw new Error('Không đúng định dạng file hồ sơ');
    const m=d.member;if(typeof m.id!=='string'||!/^mem-[a-z0-9-]{1,40}$/.test(m.id))throw new Error('Mã thành viên không hợp lệ');
    const prods=(d.products||[]).filter(p=>p&&typeof p.id==='string'&&/^prd-[a-z0-9-]{1,60}$/.test(p.id)&&typeof p.name==='string'&&Array.isArray(p.ingredients));
    const plans=(d.plans||[]).filter(p=>p&&typeof p.id==='string'&&/^pln-[a-z0-9-]{1,60}$/.test(p.id)&&typeof p.productId==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(p.start||''));
    if(!confirm(`Nhập hồ sơ của ${cleanStr(m.name,80)}: ${prods.length} sản phẩm, ${plans.length} lịch uống. Hồ sơ cũ cùng người sẽ được cập nhật. Tiếp tục?`))return;
    const old=byId(S.members,m.id)||{};
    const o={...old,id:m.id,name:cleanStr(m.name,80),born:typeof m.born==='number'?m.born:'',weight:typeof m.weight==='number'?m.weight:'',conditions:cleanStr(m.conditions,1500),meds:cleanStr(m.meds,1500),allergies:cleanStr(m.allergies,500),profile:cleanDeep(m.profile)};
    const i=S.members.findIndex(x=>x.id===o.id);i<0?S.members.push(o):S.members[i]=o;
    mergeProducts(prods);
    for(const p of plans){if(!byId(S.products,p.productId))continue;
      const pl={...(byId(S.plans,p.id)||{}),id:p.id,productId:p.productId,memberId:m.id,qty:cleanStr(p.qty,60),time:cleanStr(p.time,5),label:cleanStr(p.label,80),servings:typeof p.servings==='number'?p.servings:1,start:p.start,end:/^\d{4}-\d{2}-\d{2}$/.test(p.end||'')?p.end:''};
      const j=S.plans.findIndex(x=>x.id===pl.id);j<0?S.plans.push(pl):S.plans[j]=pl}
    S.diary=S.diary||[];
    for(const x of (d.diary||[]).filter(x=>x&&typeof x.id==='string'&&/^dia-[a-z0-9-]{1,60}$/.test(x.id)&&/^\d{4}-\d{2}-\d{2}$/.test(x.date||''))){
      if(S.diary.some(y=>y.id===x.id))continue; // không ghi đè nhật ký đã chỉnh
      S.diary.push({id:x.id,memberId:m.id,date:x.date,weight:typeof x.weight==='number'?x.weight:'',hr:typeof x.hr==='number'?x.hr:'',bp:cleanStr(x.bp,20),symptom:cleanStr(x.symptom,200),note:cleanStr(x.note,600)})}
    save();go('fam','p:'+m.id);
  }catch(e){alert('Lỗi: '+e.message)}
}
// ---- Trang hồ sơ sức khỏe: chữ lớn, tiếng Việt đơn giản, đọc từ trên xuống ----

const pUl=a=>pArr(a).length?`<ul style="margin:6px 0 0;padding-left:22px">${pArr(a).map(x=>`<li style="margin:6px 0">${esc(x)}</li>`).join('')}</ul>`:'';
const pCard=(h,body,cls)=>body?`<div class="card ${cls||''}"><h3 style="font-size:20px;margin:0 0 6px">${h}</h3>${body}</div>`:'';
function pMed(x){const st=PSTAT[x.status]||PSTAT.dang;

   <div><span class="tag" style="background:none;color:${st[1]};border:1px solid ${st[1]}">${st[0]}</span>${x.when?` <span class="tag">${esc(x.when)}</span>`:''}</div>
   ${x.why?`<div style="margin-top:4px">Để làm gì: ${esc(x.why)}</div>`:''}${x.note?`<div class="mute" style="margin-top:4px">${esc(x.note)}</div>`:''}</div>`}
// ---- Nhật ký: ghi cân, nhịp tim, huyết áp, triệu chứng, ghi chú theo ngày (lưu trong máy, có trong bản sao lưu) ----
function editDiary(mid,id){
  const e=(S.diary||[]).find(x=>x.id===id)||{id:'dia-'+uid(),memberId:mid,date:today()};
  dialog(id?'Sửa nhật ký':'Thêm nhật ký',[{k:'date',l:'Ngày',t:'date'},{k:'weight',l:'Cân nặng (kg)',t:'number'},{k:'hr',l:'Nhịp tim lúc nghỉ (lần/phút)',t:'number'},{k:'bp',l:'Huyết áp (vd: 120/80)'},{k:'symptom',l:'Triệu chứng (bồn chồn, đau bụng, mất ngủ...)'},{k:'note',l:'Ghi chú (thuốc đã đổi, kết quả khám...)',t:'area'}],e,
    o=>{if(!o.date)return;S.diary=S.diary||[];const i=S.diary.findIndex(x=>x.id===o.id);i<0?S.diary.push(o):S.diary[i]=o;save();render()})}
function delDiary(id){if(!confirm('Xoá dòng nhật ký này?'))return;S.diary=(S.diary||[]).filter(x=>x.id!==id);save();render()}
function diaryCard(m){
  const l=(S.diary||[]).filter(x=>x.memberId===m.id).sort((a,b)=>b.date.localeCompare(a.date));
  const row=x=>`<div style="border-top:1px solid var(--line);padding:10px 0"><div><b>${esc(x.date.split('-').reverse().join('/'))}</b>
    ${x.weight!==''&&x.weight!=null?`<span class="tag">${esc(x.weight)} kg</span>`:''}${x.hr!==''&&x.hr!=null?`<span class="tag">tim ${esc(x.hr)}/phút</span>`:''}${x.bp?`<span class="tag">HA ${esc(x.bp)}</span>`:''}</div>
    ${x.symptom?`<div>Triệu chứng: ${esc(x.symptom)}</div>`:''}${x.note?`<div class="mute">${esc(x.note)}</div>`:''}
    <div class="row"><button class="btn sm" onclick="editDiary('${m.id}','${x.id}')">Sửa</button><button class="btn sm del" onclick="delDiary('${x.id}')">Xoá</button></div></div>`;
  return`<div class="card"><h3 style="font-size:20px;margin:0 0 6px">📓 Nhật ký</h3><div class="mute">Ghi mỗi khi có thay đổi: cân, nhịp tim, huyết áp, triệu chứng, đổi thuốc.</div>
    <div class="row" style="margin:8px 0"><button class="btn pri" onclick="editDiary('${m.id}')">+ Thêm nhật ký hôm nay</button></div>${l.map(row).join('')||'<div class="mute">Chưa có dòng nhật ký nào.</div>'}</div>`}
function vProfile(mid){
  const m=byId(S.members,mid),P=m&&m.profile;if(!P){sub=null;return vFam()}
  const W=warningsFor(m),age=ageOf(m);
  const top=`<div class="row" style="margin:0 0 10px"><button class="btn" onclick="goBack(()=>{go('fam','m:${m.id}')})">‹ ${esc(m.name)}</button></div>`;
  const live=pArr(S.plans.filter(x=>x.memberId===m.id&&(!x.end||x.end>=today())&&byId(S.products,x.productId)).map(x=>{const p=byId(S.products,x.productId);return`<div style="border-top:1px solid var(--line);padding:8px 0;display:flex;gap:10px;align-items:center">${thumbHtml(p,48)}<div><b style="font-size:17px">${esc(p.name)}</b><div class="mute">${esc(p.brand||'')} · ${esc(x.qty||'')} · ${esc(x.time||'')} ${esc(x.label||'')}</div></div></div>`})).join('');
  view('Hồ sơ sức khỏe',`${m.name}${age?' · '+age+' tuổi':''}${m.weight?' · '+m.weight+' kg':''}`,

  const more=(list,label)=>list.length>MAIN_CAP?`<details class="fam"><summary>${label} ${list.length-MAIN_CAP}</summary><div class="chips" style="flex-wrap:wrap;overflow:visible;margin-top:6px">${list.slice(MAIN_CAP).map(chipSoft).join('')}</div></details>`:'';
  return `<div class="sec2"><b>💊 Tủ của bạn</b><span class="mute">${prods.length} sản phẩm · ${mine.length} chất</span></div>
    <div class="pcs">${shown.map(card).join('')}${prods.length>12?`<button class="pc more" onclick="go('shelf')"><span class="ph">＋${prods.length-12}</span><b>Xem tất cả</b></button>`:''}</div>
    ${main.length?`<div class="mute" style="margin:8px 0 6px">Hoạt chất chính, bấm để đọc bài${mine.some(s=>s.count>1)?' (số nhỏ là số sản phẩm có chất đó)':''}</div><div class="chips" style="flex-wrap:wrap;overflow:visible">${main.slice(0,MAIN_CAP).map(chipSoft).join('')}</div>${more(main,'Xem thêm hoạt chất:')}`:''}
    ${other.length?`<details class="fam" style="margin-top:8px"><summary>Thành phần khác trên nhãn · ${other.length}</summary><div class="chips" style="flex-wrap:wrap;overflow:visible;margin-top:6px">${other.map(chipSoft).join('')}</div><div class="mute" style="margin-top:4px">Chưa có bài kiến thức trong app cho các thành phần này.</div></details>`:''}`}
function vLib(){
  if(libF==='topic')return libTopicView();
  const q=norm(libQ),subs=substList(),docs=S.docs||[],notes=S.notes;
  const kbText=s=>{const k=kbOf(s);return k?norm([k.what,...(k.benefits||[]).map(b=>b[1])].join(' ')):''};
  const nameHit=s=>norm(s.name+' '+((kbOf(s)||{}).aka||'')).includes(q);
  let rs=q?subs.filter(s=>nameHit(s)||kbText(s).includes(q)).sort((a,b)=>nameHit(b)-nameHit(a)):subs;
  // gom dạng muối về chất mẹ nếu chất mẹ có trong kết quả
  const have=new Set(rs.map(kbKeyOf));
  rs=rs.filter(s=>{const k=kbKeyOf(s);return !Object.entries(famOf()).some(([p,f])=>f.forms.includes(k)&&have.has(p))});
  const rd=docs.filter(x=>!q||docText(x).includes(q));
  const rn=notes.filter(n=>!q||(n.title+' '+n.substance+' '+n.kind+' '+n.content).toLowerCase().includes(q));
  const topics=window.KB_TOPICS||[];
  const rt=q?topics.filter(t=>norm(t.n).includes(q)||(()=>{try{return new RegExp(t.re,'i').test(q)}catch(e){return false}})()):[];
  const tile=t=>`<button class="tpc" onclick="openTopic('${t.id}')"><span class="te">${t.e}</span><span><b>${esc(t.n)}</b><span class="mute">${t.subs.length} chất</span></span></button>`;
  const home=!q&&libF==='all';
  const box=`<input id="libQ" placeholder="Tìm: mất ngủ, magie, B12, gout…" value="${esc(libQ)}" oninput="libQ=this.value;vKnow();const i=document.getElementById('libQ');i.focus();i.setSelectionRange(99,99)" style="margin-bottom:10px">`;
  const chips=[['all','Tất cả',rs.length+rd.length+rn.length],['sub','Hoạt chất',rs.length],['doc','Tài liệu',rd.length],['note','Ghi chú',rn.length]];
  const head=box+(home?'':`<div class="chips" style="flex-wrap:wrap;overflow:visible;margin-bottom:10px">${chips.map(([k,l,n])=>`<button class="${libF===k?'on':''}" onclick="libSet('${k}')">${l} · ${n}</button>`).join('')}</div>`);
  const sec=(t,n,body,more)=>body?`<div style="margin:14px 0 6px"><b>${t}</b> <span class="mute">(${n})</span></div>${body}${more||''}`:'';
  const moreBtn=(k,n,cap)=>n>cap?`<div class="row"><button class="btn sm" onclick="libSet('${k}')">Xem cả ${n}</button></div>`:'';
  const by=substByKey();
  const subRow=s=>libSubRow(s)+famBlock(s,by);
  let body='';
  if(home){
    body=cabinetBlock(rs)+
      `<div class="sec2"><b>🔎 Tìm theo chủ đề</b><span class="mute">bấm để xem chất nào hợp</span></div><div class="tpgrid">${topics.map(tile).join('')}</div>
       <div class="sec2"><b>📚 Duyệt theo loại</b></div>
       <div class="kinds"><button onclick="libSet('sub')"><span>🧬</span><b>Hoạt chất</b><span class="mute">${rs.length}</span></button><button onclick="libSet('doc')"><span>📄</span><b>Tài liệu</b><span class="mute">${docs.length}</span></button><button onclick="libSet('note')"><span>📝</span><b>Ghi chú</b><span class="mute">${notes.length}</span></button></div>
       ${docs.length?'':'<div class="mute" style="margin-top:6px">Chưa có tài liệu. Nhập file ở Cài đặt, mục Cập nhật dữ liệu.</div>'}`;
  }else if(libF==='sub'&&!q){
    const order=[...(window.KB_CATS||[]).map(c=>c.n),'Khác (chưa có bài)'];
    const groups=order.map(n=>[n,subs.filter(s=>catNameOf(s)===n&&!isForm(s)),subs.filter(s=>catNameOf(s)===n)]).filter(([,l])=>l.length);
    body=groups.map(([n,l,all])=>`<details style="margin-top:6px"><summary style="cursor:pointer"><b style="font-size:14px">${esc(n)}</b> <span class="mute">(${l.length})</span></summary>${catChips(all)}</details>`).join('');
  }else{
    const capS=libF==='all'?6:200,capD=libF==='all'?6:200,capN=libF==='all'?4:200;
    if(libF==='all'&&rt.length)body+=sec('Chủ đề',rt.length,`<div class="tpgrid">${rt.map(tile).join('')}</div>`);
    if(libF==='all'||libF==='sub')body+=sec('Hoạt chất',rs.length,rs.slice(0,capS).map(subRow).join(''),libF==='all'?moreBtn('sub',rs.length,capS):'');
    if(libF==='all'||libF==='doc')body+=sec('Tài liệu',rd.length,rd.slice(0,capD).map(libDocRow).join(''),libF==='all'?moreBtn('doc',rd.length,capD):'');
    if(libF==='all'||libF==='note')body+=sec('Ghi chú',rn.length,rn.slice(0,capN).map(libNoteCard).join(''),libF==='all'?moreBtn('note',rn.length,capN):'');
    if(!body)body=`<div class="empty">Không tìm thấy “${esc(libQ)}”. Thử từ khác, hoặc bỏ bộ lọc loại.</div>`;
  }
  const actions=`<div class="row" style="margin-top:14px"><button class="btn pri" onclick="editNote()">+ Thêm ghi chú</button><button class="btn" onclick="go('set')">Cập nhật từ file</button>${(q||libF!=='all')?`<button class="btn" onclick="libQ='';libF='all';vKnow()">Xoá tìm kiếm</button>`:''}</div>`;
  view('Thư viện',`${(window.KB_TOPICS||[]).length} chủ đề · ${Object.keys(window.KB||{}).length-Object.values(famOf()).reduce((a,f)=>a+f.forms.length,0)} hoạt chất · ${docs.length} tài liệu`,head+body+actions);
}
function vKnow(){
  if(sub&&String(sub).startsWith('d:'))return vDoc(String(sub).slice(2));
  if(sub)return vSubstance(sub);
  vLib();
}

    if(!rules.length)throw new Error('Khung này chưa có mục nào (cần điền nguồn của bác sĩ trước)');

async function gEnsureTabs(){

  const add=SYNC_TABS.filter(t=>!have.has(t.tab)).map(t=>({addSheet:{properties:{title:t.tab}}}));

const colLetter=n=>String.fromCharCode(64+n);
/* Tính kết quả gộp cho một bảng. Không ghi gì cả. */
function mergeTab(t,locList,rows,base){
  const L={},R={};
  for(const x of locList)L[x.id]=t.pub(x);
  for(const row of rows){try{const j=JSON.parse(row[t.cols.length]||'');if(j&&typeof j.id==='string')R[j.id]=j}catch(e){}}
  const ids=new Set([...Object.keys(L),...Object.keys(R)]);
  const out={keep:{},stats:{up:0,down:0,delLocal:0,conflict:0,same:0},conflicts:[],skipDelLocal:[]};
  for(const id of ids){
    const l=L[id],r=R[id],b=base[id],hl=l?hsh(l):null,hr=r?hsh(r):null;
    if(l&&r){
      if(hl===hr){out.keep[id]=l;out.stats.same++}
      else if(b===undefined||(hl!==b&&hr!==b)){out.conflicts.push({id,l,r});out.stats.conflict++}
      else if(hl===b){out.keep[id]=r;out.stats.down++}
      else{out.keep[id]=l;out.stats.up++}
    }else if(l&&!r){
      if(b!==undefined&&hl===b){out.stats.delLocal++;out.skipDelLocal.push(id)} // đã bị xoá ở nơi khác
      else{out.keep[id]=l;out.stats.up++}
    }else if(!l&&r){
      if(b!==undefined&&hr===b){/* đã xoá ở máy này: không gửi lại */}
      else{out.keep[id]=r;out.stats.down++}
    }
  }
  return out}
async function syncAll(){

        else if(t.key==='members'&&byId0[id])rec={...byId0[id],...rec}; // lấy từ Sheet nhưng giữ phần riêng tư của máy này
        if(!byId0[id]){ // bản ghi mới từ Sheet: chỉ nhận khi đã có thứ nó tham chiếu
          if(t.key==='plans'&&!byId(S.products,rec.productId)){skipped++;pushOnly.push(rec);continue}
          if(t.key==='intakes'&&!byId(S.plans,rec.planId)){skipped++;pushOnly.push(rec);continue}
          if(t.key==='members')rec={conditions:'',meds:'',allergies:'',...rec}}
