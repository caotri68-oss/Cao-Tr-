<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ TPCN gia đình</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e3e7ec;--pri:#0f766e;--pri2:#ccfbf1;--warn:#b45309;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--card:#18202a;--ink:#e6ebf1;--mute:#93a0b0;--line:#2a3441;--pri:#2dd4bf;--pri2:#123a38;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
h1{font-size:18px;margin:0;padding:12px 0 4px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}
nav button{border:0;background:none;color:var(--mute);padding:8px 12px;border-radius:8px;font:inherit;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--pri2);color:var(--pri);font-weight:600}
main{padding:16px 0 64px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar .sp{flex:1}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
textarea{min-height:90px;resize:vertical}
.bar input,.bar select{width:auto;min-width:140px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:8px;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#06201d}}
.btn.sm{padding:4px 8px;font-size:13px}.btn.del{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card h3{margin:0 0 2px;font-size:16px}
.mute{color:var(--mute);font-size:13px}
.tag{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:999px;padding:1px 9px;font-size:12px;margin:2px 4px 2px 0}
.tag.w{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);background:var(--card);color:var(--ink);max-height:92vh}
dialog::backdrop{background:#0008}
dialog form{padding:16px;display:grid;gap:10px}
dialog label{display:grid;gap:3px;font-size:13px;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgs{display:flex;gap:6px;flex-wrap:wrap}.imgs img{height:70px;border-radius:6px;border:1px solid var(--line)}
pre.txt{white-space:pre-wrap;background:var(--bg);padding:8px;border-radius:8px;max-height:220px;overflow:auto;font:13px/1.45 inherit;margin:6px 0 0}
.empty{text-align:center;color:var(--mute);padding:36px 0}
#report{display:none}
@media print{header,main,.noprint{display:none!important}#report{display:block}body{background:#fff;color:#000}}
</style>
</head>
<body>
<header><div class="wrap"><h1>💊 Sổ TPCN gia đình</h1>
<nav id="nav"></nav></div></header>
<main class="wrap" id="view"></main>
<div id="report"></div>
<dialog id="dlg"></dialog>

<script>
'use strict';
/* ---------- Lưu trữ: IndexedDB, một bản ghi duy nhất ---------- */
const DB='tpcn-family',KEY='state';
const empty=()=>({members:[],products:[],logs:[],notes:[]});
let S=empty();
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){try{const db=await idb();S=await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(KEY);q.onsuccess=()=>res(q.result||empty());q.onerror=()=>res(empty())});for(const k of Object.keys(empty()))S[k]=S[k]||[]}catch(e){alert('Không mở được bộ nhớ trình duyệt: '+e.message)}}
let saveT;async function flush(){try{const db=await idb();db.transaction('kv','readwrite').objectStore('kv').put(S,KEY)}catch(e){alert('Lưu thất bại: '+e.message)}}
function save(){clearTimeout(saveT);saveT=setTimeout(flush,50)}
addEventListener('pagehide',()=>{clearTimeout(saveT);flush()});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

/* ---------- Tiện ích ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const byId=(arr,id)=>arr.find(x=>x.id===id);
const pname=id=>byId(S.products,id)?.name||'(đã xoá)';
const mname=id=>byId(S.members,id)?.name||'(đã xoá)';
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const link=u=>safeUrl(u)?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">liên kết</a>`:'';
const STATUS={xem:'Đã xem',muon:'Muốn mua',mua:'Đã mua',dung:'Đã từng dùng'};
const age=b=>b?new Date().getFullYear()-Number(b):'';

/* ---------- Điều hướng ---------- */
const TABS=[['now','Đang uống'],['prod','Sản phẩm'],['hist','Lịch sử'],['know','Kiến thức'],['imp','Nhập link / ảnh'],['fam','Gia đình'],['bak','Xuất / sao lưu']];
let tab=localStorage.getItem('tab')||'now',q='',fStatus='',fMember='';
function nav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k===tab?'on':''}">${l}</button>`).join('')}
$('#nav').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;q='';try{localStorage.setItem('tab',t)}catch{}render()}};
function render(){nav();({now:vNow,prod:vProd,hist:vHist,know:vKnow,imp:vImp,fam:vFam,bak:vBak})[tab]()}
function view(h){$('#view').innerHTML=h}

/* ---------- Hộp thoại / form ---------- */
function dialog(title,fields,data,onSave){
  const d=$('#dlg');
  const f=fields.map(x=>{
    const v=data[x.k]??'';const id='f_'+x.k;
    if(x.t==='area')return`<label>${x.l}<textarea id="${id}">${esc(v)}</textarea></label>`;
    if(x.t==='sel')return`<label>${x.l}<select id="${id}">${x.o.map(([val,lab])=>`<option value="${esc(val)}" ${val===v?'selected':''}>${esc(lab)}</option>`).join('')}</select></label>`;
    return`<label>${x.l}<input id="${id}" type="${x.t||'text'}" value="${esc(v)}" ${x.step?`step="${x.step}"`:''}></label>`}).join('');
  d.innerHTML=`<form method="dialog"><b>${title}</b>${f}<div class="row"><button class="btn pri" value="ok">Lưu</button><button class="btn" value="x" formnovalidate>Huỷ</button></div></form>`;
  d.onclose=()=>{if(d.returnValue!=='ok')return;const o={...data};fields.forEach(x=>{let v=$('#f_'+x.k).value;if(x.t==='number')v=v===''?'':Number(v);o[x.k]=typeof v==='string'?v.trim():v});onSave(o)};
  d.returnValue='';d.showModal();
}
const upsert=(arr,o)=>{const i=arr.findIndex(x=>x.id===o.id);i<0?arr.push(o):arr[i]=o;save();render()};
const remove=(arr,id,msg)=>{if(confirm(msg||'Xoá mục này?')){arr.splice(arr.findIndex(x=>x.id===id),1);save();render()}};

/* ---------- Gia đình ---------- */
function editMember(id){const m=byId(S.members,id)||{id:uid()};
  dialog(id?'Sửa thành viên':'Thêm thành viên',[{k:'name',l:'Tên / vai trò'},{k:'born',l:'Năm sinh',t:'number'},{k:'note',l:'Bệnh nền, thuốc đang dùng, dị ứng',t:'area'}],m,o=>{if(!o.name)return;upsert(S.members,o)})}
function vFam(){
  view(`<div class="bar"><button class="btn pri" onclick="editMember()">+ Thêm thành viên</button></div>`+
  (S.members.map(m=>`<div class="card"><h3>${esc(m.name)} <span class="mute">${m.born?`· ${esc(m.born)} (${age(m.born)} tuổi)`:''}</span></h3>
   <div class="mute">${esc(m.note)||'Chưa ghi bệnh nền / thuốc đang dùng'}</div>
   <div class="row"><button class="btn sm" onclick="editMember('${m.id}')">Sửa</button><button class="btn sm del" onclick="remove(S.members,'${m.id}','Xoá thành viên này? Lịch sử uống vẫn còn nhưng mất tên.')">Xoá</button></div></div>`).join('')||`<div class="empty">Chưa có thành viên. Thêm người trong gia đình để ghi ai đang uống gì.</div>`))}

/* ---------- Sản phẩm ---------- */
const PF=[{k:'name',l:'Tên sản phẩm'},{k:'brand',l:'Hãng'},{k:'form',l:'Dạng bào chế (viên, bột, nước…)'},
 {k:'ingredients',l:'Thành phần / hàm lượng / dạng hoạt chất',t:'area'},{k:'dosage',l:'Liều ghi trên nhãn'},
 {k:'price',l:'Giá (CZK)',t:'number',step:'any'},{k:'store',l:'Mua ở đâu'},{k:'url',l:'Link sản phẩm'},
 {k:'status',l:'Trạng thái',t:'sel',o:Object.entries(STATUS)},
 {k:'warnings',l:'Cảnh báo / tương tác / chống chỉ định',t:'area'},{k:'notes',l:'Ghi chú cá nhân',t:'area'}];
function editProduct(id,pre){const p=byId(S.products,id)||{id:uid(),status:'xem',images:[],text:'',added:today(),...(pre||{})};
  dialog(id?'Sửa sản phẩm':'Thêm sản phẩm',PF,p,o=>{if(!o.name)return;upsert(S.products,o)})}
function vProd(){
  const l=S.products.filter(p=>(!fStatus||p.status===fStatus)&&(!q||JSON.stringify(p).toLowerCase().includes(q)));
  view(`<div class="bar"><button class="btn pri" onclick="editProduct()">+ Thêm sản phẩm</button><span class="sp"></span>
   <select onchange="fStatus=this.value;vProd()"><option value="">Mọi trạng thái</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===fStatus?'selected':''}>${v}</option>`).join('')}</select>
   <input placeholder="Tìm…" value="${esc(q)}" oninput="q=this.value.toLowerCase();vProd();const i=document.querySelector('.bar input');i.focus();i.setSelectionRange(99,99)"></div>`+
  `<div class="grid">${l.map(p=>{const using=S.logs.filter(x=>x.productId===p.id&&!x.end).map(x=>mname(x.memberId));
   return`<div class="card"><h3>${esc(p.name)}</h3><div class="mute">${esc([p.brand,p.form].filter(Boolean).join(' · '))}</div>
   <div><span class="tag">${STATUS[p.status]||''}</span>${using.length?`<span class="tag">Đang uống: ${esc(using.join(', '))}</span>`:''}${p.warnings?`<span class="tag w">⚠ có cảnh báo</span>`:''}</div>
   ${p.ingredients?`<div class="mute">${esc(p.ingredients).slice(0,160)}</div>`:''}
   <div class="mute">${p.price!==''&&p.price!=null?esc(p.price)+' CZK':''} ${esc(p.store||'')} ${link(p.url)}</div>
   <div class="imgs">${(p.images||[]).map(s=>`<img src="${s}">`).join('')}</div>
   <div class="row"><button class="btn sm" onclick="openProduct('${p.id}')">Chi tiết</button><button class="btn sm" onclick="editLog(null,'${p.id}')">+ Bắt đầu uống</button><button class="btn sm" onclick="editProduct('${p.id}')">Sửa</button><button class="btn sm del" onclick="remove(S.products,'${p.id}','Xoá sản phẩm này?')">Xoá</button></div></div>`}).join('')}</div>`+
  (l.length?'':`<div class="empty">Chưa có sản phẩm nào khớp.</div>`))}
function openProduct(id){const p=byId(S.products,id),d=$('#dlg');
  const logs=S.logs.filter(x=>x.productId===id),notes=S.notes.filter(n=>n.productId===id);
  d.innerHTML=`<form method="dialog"><b>${esc(p.name)}</b><div class="mute">${esc([p.brand,p.form,p.dosage].filter(Boolean).join(' · '))}</div>
  ${p.ingredients?`<div><b>Thành phần</b><pre class="txt">${esc(p.ingredients)}</pre></div>`:''}
  ${p.warnings?`<div><b style="color:var(--warn)">⚠ Cảnh báo</b><pre class="txt">${esc(p.warnings)}</pre></div>`:''}
  ${p.notes?`<div><b>Ghi chú</b><pre class="txt">${esc(p.notes)}</pre></div>`:''}
  ${p.text?`<div><b>Văn bản đã trích xuất</b><pre class="txt">${esc(p.text)}</pre></div>`:''}
  <div><b>Lịch sử dùng (${logs.length})</b>${logs.map(x=>`<div class="mute">${esc(mname(x.memberId))}: ${esc(x.start)} → ${esc(x.end||'nay')} ${esc(x.dose)}</div>`).join('')||'<div class="mute">Chưa có</div>'}</div>
  <div><b>Ghi chú kiến thức liên quan (${notes.length})</b>${notes.map(n=>`<div class="mute">• ${esc(n.title)}</div>`).join('')||'<div class="mute">Chưa có</div>'}</div>
  <div class="row"><button class="btn" value="x">Đóng</button></div></form>`;d.onclose=null;d.showModal()}

/* ---------- Đang uống / Lịch sử ---------- */
function editLog(id,productId){
  if(!S.members.length||!S.products.length){alert('Cần có ít nhất 1 thành viên và 1 sản phẩm trước.');return}
  const x=byId(S.logs,id)||{id:uid(),productId:productId||S.products[0].id,memberId:S.members[0].id,start:today()};
  dialog(id?'Sửa lượt uống':'Ghi lượt uống',[
   {k:'memberId',l:'Ai uống',t:'sel',o:S.members.map(m=>[m.id,m.name])},
   {k:'productId',l:'Sản phẩm',t:'sel',o:S.products.map(p=>[p.id,p.name])},
   {k:'start',l:'Bắt đầu',t:'date'},{k:'end',l:'Kết thúc (để trống nếu vẫn đang uống)',t:'date'},
   {k:'dose',l:'Liều thực tế (vd: 1 viên/sáng sau ăn)'},{k:'reason',l:'Mục đích'},
   {k:'effect',l:'Cảm nhận / hiệu quả quan sát được',t:'area'},{k:'side',l:'Tác dụng phụ',t:'area'}],x,o=>upsert(S.logs,o))}
function logCard(x){return`<div class="card"><h3>${esc(pname(x.productId))}</h3><div class="mute">${esc(mname(x.memberId))} · ${esc(x.start)} → ${esc(x.end||'nay')}</div>
  <div>${esc(x.dose)} ${x.reason?`<span class="tag">${esc(x.reason)}</span>`:''}</div>
  ${x.effect?`<div class="mute">Hiệu quả: ${esc(x.effect)}</div>`:''}${x.side?`<div class="mute" style="color:var(--warn)">Phụ: ${esc(x.side)}</div>`:''}
  <div class="row">${x.end?'':`<button class="btn sm" onclick="stopLog('${x.id}')">Dừng hôm nay</button>`}<button class="btn sm" onclick="editLog('${x.id}')">Sửa</button><button class="btn sm del" onclick="remove(S.logs,'${x.id}')">Xoá</button></div></div>`}
function stopLog(id){byId(S.logs,id).end=today();save();render()}
const memSel=()=>`<select onchange="fMember=this.value;render()"><option value="">Cả nhà</option>${S.members.map(m=>`<option value="${m.id}" ${m.id===fMember?'selected':''}>${esc(m.name)}</option>`).join('')}</select>`;
function vNow(){
  const l=S.logs.filter(x=>!x.end&&(!fMember||x.memberId===fMember));
  const groups={};l.forEach(x=>(groups[x.memberId]=groups[x.memberId]||[]).push(x));
  view(`<div class="bar"><button class="btn pri" onclick="editLog()">+ Ghi lượt uống</button><span class="sp"></span>${memSel()}</div>`+
   (Object.keys(groups).map(mid=>`<h3 style="margin:14px 0 6px">${esc(mname(mid))}</h3>${groups[mid].map(logCard).join('')}`).join('')||`<div class="empty">Chưa có ai đang uống gì.<br>Thêm thành viên (tab Gia đình) và sản phẩm, rồi bấm “Ghi lượt uống”.</div>`))}
function vHist(){
  const l=S.logs.filter(x=>(!fMember||x.memberId===fMember)&&(!q||(pname(x.productId)+mname(x.memberId)+x.effect+x.side).toLowerCase().includes(q))).sort((a,b)=>(b.start||'').localeCompare(a.start||''));
  view(`<div class="bar"><span class="sp"></span>${memSel()}<input placeholder="Tìm…" value="${esc(q)}" oninput="q=this.value.toLowerCase();vHist();const i=document.querySelector('.bar input');i.focus();i.setSelectionRange(99,99)"></div>`+(l.map(logCard).join('')||`<div class="empty">Chưa có lịch sử.</div>`))}

/* ---------- Kiến thức ---------- */
function editNote(id,pre){const n=byId(S.notes,id)||{id:uid(),added:today(),...(pre||{})};
  dialog(id?'Sửa ghi chú':'Thêm ghi chú kiến thức',[{k:'title',l:'Tiêu đề'},{k:'tags',l:'Thẻ (cách nhau bằng dấu phẩy)'},
   {k:'productId',l:'Gắn với sản phẩm',t:'sel',o:[['','(không)'],...S.products.map(p=>[p.id,p.name])]},
   {k:'source',l:'Nguồn (link hoặc tên tài liệu)'},{k:'content',l:'Nội dung',t:'area'}],n,o=>{if(!o.title)return;upsert(S.notes,o)})}
function vKnow(){
  const l=S.notes.filter(n=>!q||JSON.stringify(n).toLowerCase().includes(q));
  view(`<div class="bar"><button class="btn pri" onclick="editNote()">+ Thêm ghi chú</button><span class="sp"></span><input placeholder="Tìm…" value="${esc(q)}" oninput="q=this.value.toLowerCase();vKnow();const i=document.querySelector('.bar input');i.focus();i.setSelectionRange(99,99)"></div>`+
  (l.map(n=>`<div class="card"><h3>${esc(n.title)}</h3><div>${(n.tags||'').split(',').filter(t=>t.trim()).map(t=>`<span class="tag">${esc(t.trim())}</span>`).join('')}${n.productId?`<span class="tag">${esc(pname(n.productId))}</span>`:''}</div>
   <pre class="txt">${esc(n.content)}</pre><div class="mute">${esc(n.added||'')} · ${safeUrl(n.source)?link(n.source):esc(n.source||'')}</div>
   <div class="row"><button class="btn sm" onclick="editNote('${n.id}')">Sửa</button><button class="btn sm del" onclick="remove(S.notes,'${n.id}')">Xoá</button></div></div>`).join('')||`<div class="empty">Chưa có ghi chú kiến thức.</div>`))}

/* ---------- Nhập từ link / ảnh ---------- */
let stage={title:'',source:'',text:'',images:[]};
async function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)})}
function loadScript(src){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Không tải được thư viện OCR (cần internet lần đầu)'));document.head.appendChild(s)})}
async function ocr(dataUrls,log){
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  const w=await Tesseract.createWorker('vie+ces+eng',1,{logger:m=>{if(m.status==='recognizing text')log(Math.round(m.progress*100)+'%')}});
  let out='';try{for(const [i,u] of dataUrls.entries()){log(`Ảnh ${i+1}/${dataUrls.length}…`);const r=await w.recognize(u);out+=(out?'\n\n':'')+r.data.text.trim()}}finally{await w.terminate()}return out}
async function fetchText(url){
  if(!safeUrl(url))throw new Error('Link phải bắt đầu bằng http:// hoặc https://');
  try{const r=await fetch(url);if(!r.ok)throw 0;const h=await r.text();const d=new DOMParser().parseFromString(h,'text/html');d.querySelectorAll('script,style,nav,footer,noscript,svg').forEach(e=>e.remove());return{title:d.title,text:(d.body.innerText||d.body.textContent).replace(/\n{3,}/g,'\n\n').trim()}}
  catch{ if(!confirm('Trình duyệt không đọc trực tiếp được trang này (chặn CORS).\nDùng dịch vụ r.jina.ai để lấy bản văn bản? Link sẽ được gửi tới dịch vụ đó.'))throw new Error('Đã huỷ. Bạn có thể tự dán nội dung vào ô bên dưới.');
    const r=await fetch('https://r.jina.ai/'+url);if(!r.ok)throw new Error('Dịch vụ trả lỗi '+r.status);const t=await r.text();return{title:(t.match(/^Title:\s*(.+)$/m)||[])[1]||'',text:t}}}
function vImp(){
  view(`<div class="card"><b>1. Lấy nội dung</b>
  <label class="mute">Link trang web<div class="row"><input id="u" placeholder="https://…" style="flex:1"><button class="btn" id="bu">Lấy văn bản</button></div></label>
  <label class="mute" style="display:block;margin-top:8px">Ảnh nhãn / bao bì / ảnh chụp bài viết (nhiều ảnh được)<input id="im" type="file" accept="image/*" multiple></label>
  <div class="mute" id="st" style="margin-top:6px">OCR chạy ngay trong trình duyệt (tiếng Việt, Séc, Anh). Lần đầu cần internet để tải dữ liệu ngôn ngữ. Nên kiểm tra lại chữ nhận dạng sai, nhất là hàm lượng và liều.</div></div>
  <div class="card"><b>2. Kiểm tra &amp; lưu</b>
  <div class="two" style="margin-top:6px"><label class="mute">Tiêu đề<input id="t" value="${esc(stage.title)}"></label><label class="mute">Nguồn<input id="s" value="${esc(stage.source)}"></label></div>
  <label class="mute" style="display:block;margin-top:8px">Văn bản<textarea id="x" style="min-height:200px">${esc(stage.text)}</textarea></label>
  <div class="imgs" id="pv">${stage.images.map(s=>`<img src="${s}">`).join('')}</div>
  <div class="row"><button class="btn pri" id="a1">Lưu thành ghi chú kiến thức</button><button class="btn" id="a2">Tạo sản phẩm mới từ đây</button>
  <select id="pp" style="width:auto"><option value="">Gắn vào sản phẩm có sẵn…</option>${S.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div></div>`);
  const sync=()=>{stage.title=$('#t').value;stage.source=$('#s').value;stage.text=$('#x').value};
  ['t','s','x'].forEach(i=>$('#'+i).oninput=sync);
  const st=m=>$('#st').textContent=m;
  $('#bu').onclick=async()=>{const u=$('#u').value.trim();try{st('Đang lấy…');const r=await fetchText(u);stage.title=stage.title||r.title;stage.source=u;stage.text=r.text;vImp();$('#st').textContent='Xong. Kiểm tra lại nội dung bên dưới.'}catch(e){st('Lỗi: '+e.message)}};
  $('#im').onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;try{st('Đang xử lý ảnh…');const urls=[];for(const f of fs)urls.push(await shrink(f));stage.images.push(...urls);const t=await ocr(urls,st);stage.text=(stage.text?stage.text+'\n\n':'')+t;vImp();$('#st').textContent='OCR xong. Hãy soát lại chữ.'}catch(err){st('Lỗi: '+err.message)}};
  $('#a1').onclick=()=>{sync();if(!stage.text.trim()){alert('Chưa có văn bản.');return}S.notes.push({id:uid(),title:stage.title||'Ghi chú '+today(),tags:'',productId:$('#pp').value,source:stage.source,content:stage.text,added:today()});save();stage={title:'',source:'',text:'',images:[]};tab='know';render()};
  $('#a2').onclick=()=>{sync();const imgs=stage.images,txt=stage.text,src=stage.source;stage={title:'',source:'',text:'',images:[]};tab='prod';render();editProduct(null,{name:$('#t')?.value||'',url:src,text:txt,images:imgs})};
  $('#pp').onchange=e=>{const id=e.target.value;if(!id)return;sync();const p=byId(S.products,id);p.text=((p.text?p.text+'\n\n':'')+stage.text).trim();p.images=[...(p.images||[]),...stage.images];if(!p.url&&safeUrl(stage.source))p.url=stage.source;save();stage={title:'',source:'',text:'',images:[]};tab='prod';render()};
}

/* ---------- Xuất / sao lưu / báo cáo ---------- */
function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const csvCell=v=>{v=String(v??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCsv=(rows,cols)=>'﻿'+[cols.map(c=>c[1]).join(','),...rows.map(r=>cols.map(c=>csvCell(c[2]?c[2](r):r[c[0]])).join(','))].join('\r\n');
function vBak(){
  view(`<div class="card"><b>Sao lưu toàn bộ (JSON)</b><div class="mute">Dữ liệu chỉ nằm trong trình duyệt này. Hãy tải bản sao lưu định kỳ, nhất là trước khi xoá dữ liệu trình duyệt.</div>
  <div class="row"><button class="btn pri" id="ej">Tải JSON</button><label class="btn">Khôi phục từ JSON<input type="file" id="ij" accept=".json" hidden></label></div></div>
  <div class="card"><b>Xuất bảng tính (CSV, mở bằng Excel / Google Sheets)</b>
  <div class="row"><button class="btn" id="ep">Sản phẩm</button><button class="btn" id="el">Lịch sử uống</button><button class="btn" id="en">Kiến thức</button></div></div>
  <div class="card"><b>Báo cáo in / lưu PDF (đem đi khám, đưa bác sĩ, dược sĩ)</b>
  <div class="row"><select id="rm" style="width:auto">${S.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><button class="btn" id="rp">In báo cáo</button></div></div>`);
  $('#ej').onclick=()=>dl(`tpcn-backup-${today()}.json`,JSON.stringify(S),'application/json');
  $('#ij').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.products)||!Array.isArray(d.logs))throw new Error('Không đúng định dạng sao lưu');if(!confirm('Khôi phục sẽ GHI ĐÈ toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;S={...empty(),...d};save();render()}catch(err){alert('Lỗi: '+err.message)}};
  $('#ep').onclick=()=>dl('san-pham.csv',toCsv(S.products,[['name','Tên'],['brand','Hãng'],['form','Dạng'],['ingredients','Thành phần'],['dosage','Liều nhãn'],['price','Giá CZK'],['store','Nơi mua'],['url','Link'],['status','Trạng thái',p=>STATUS[p.status]],['warnings','Cảnh báo'],['notes','Ghi chú']]),'text/csv');
  $('#el').onclick=()=>dl('lich-su-uong.csv',toCsv(S.logs,[['m','Người',x=>mname(x.memberId)],['p','Sản phẩm',x=>pname(x.productId)],['start','Bắt đầu'],['end','Kết thúc'],['dose','Liều'],['reason','Mục đích'],['effect','Hiệu quả'],['side','Tác dụng phụ']]),'text/csv');
  $('#en').onclick=()=>dl('kien-thuc.csv',toCsv(S.notes,[['title','Tiêu đề'],['tags','Thẻ'],['p','Sản phẩm',n=>n.productId?pname(n.productId):''],['source','Nguồn'],['content','Nội dung']]),'text/csv');
  $('#rp').onclick=()=>{const m=byId(S.members,$('#rm')?.value);if(!m){alert('Chưa có thành viên.');return}
    const l=S.logs.filter(x=>x.memberId===m.id).sort((a,b)=>(a.end?1:0)-(b.end?1:0)||(b.start||'').localeCompare(a.start||''));
    $('#report').innerHTML=`<h2>${esc(m.name)} ${m.born?`(${esc(m.born)})`:''}</h2><p>${esc(m.note)}</p><p>In ngày ${today()}</p><table border="1" cellpadding="4" cellspacing="0" style="border-collapse:collapse;width:100%"><tr><th>Sản phẩm</th><th>Hãng</th><th>Thành phần</th><th>Liều</th><th>Từ</th><th>Đến</th><th>Mục đích</th><th>Tác dụng phụ</th></tr>${l.map(x=>{const p=byId(S.products,x.productId)||{};return`<tr><td>${esc(p.name)}</td><td>${esc(p.brand)}</td><td>${esc(p.ingredients)}</td><td>${esc(x.dose||p.dosage)}</td><td>${esc(x.start)}</td><td>${esc(x.end||'đang uống')}</td><td>${esc(x.reason)}</td><td>${esc(x.side)}</td></tr>`}).join('')}</table>`;print()};
}

load().then(render);
</script>
</body>
</html>
